# Self-tests of the composite pipelines of lit.cfg.py: %{msil_c},
# %{msil_c_<L>}, %{msil_ll} and %{msil_cflags}, with the native-oracle and
# .NET Framework legs, under msil_pipeline=asm, the asm oracle from M23 (plan
# 5.12.1, Q31): the composite tests here are 'REQUIRES: msil-pipeline=asm'
# (the asm-oracle leg runs them) and the nested lits pass
# --param msil_pipeline=asm; ../pipeline-obj pins the default obj expansion. M0 builds no compiler, so only %clang_msil, %llc_msil
# and %clang_native are replaced, by the stand-in ../Inputs/pipeline-cc.py:
# it checks the arguments the composites pass and "compiles" <test>.c or
# <test>.ll by copying the prepared <test>.il.in (the native form assembles
# it into a .NET Framework executable). Every other substitution (ilasm,
# msil-verify, jitall, msil-run and the --expect comparison) is the real one.
import os

config.suffixes = [".c", ".ll", ".test"]

_features = config.available_features
_params = lit_config.params
_harness_dir = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))


def _quote(path):
    return '"%s"' % path.replace("\\", "/")


_triple = dict(config.substitutions)["%msil_triple"]
_native_triple = _triple[: -len("-msil")]
_windir = os.environ.get("WINDIR") or os.environ.get("SystemRoot") or r"C:\Windows"
_netfx_ilasm = os.path.join(
    _windir, "Microsoft.NET", "Framework64", "v4.0.30319", "ilasm.exe"
)
_stand_in = "%s %s" % (
    _quote(config.python_executable),
    _quote(os.path.join(_harness_dir, "Inputs", "pipeline-cc.py")),
)
_replace = {
    "%clang_msil": "%s --as clang-msil --target=%s" % (_stand_in, _triple),
    "%llc_msil": "%s --as llc-msil -mtriple=%s" % (_stand_in, _triple),
    "%clang_native": "%s --as clang-native --ilasm %s --target=%s"
    % (_stand_in, _quote(_netfx_ilasm), _native_triple),
}
config.substitutions = [(k, _replace.get(k, v)) for k, v in config.substitutions]

# The levels the composites run, as features for the checks after them:
# msil-opt-<L> for %{msil_c} (msil_opt_levels), msil-ll-opt-<L> for %{msil_ll}
# (the llc levels among them, else O2, as in lit.cfg.py).
_levels = [
    o.strip() for o in _params.get("msil_opt_levels", "O0,O2").split(",") if o.strip()
]
for _o in _levels:
    _features.add("msil-opt-" + _o)
for _o in [o for o in _levels if o in ("O0", "O1", "O2", "O3")] or ["O2"]:
    _features.add("msil-ll-opt-" + _o)

# The stand-in's native program is a .NET Framework executable, so the
# native-oracle and .NET Framework legs run only where a Windows triple runs
# on the local runner with the .NET Framework. They are what this directory
# tests, so they are on there whatever msil_native_oracle and msil_run_netfx
# say, and off everywhere else (the WSL runner, Linux).
if (
    _params.get("msil_runner", "local") == "local"
    and {"msil-triple-windows", "msil-netfx"} <= _features
    and os.path.isfile(_netfx_ilasm)
):
    _features.add("msil-native-oracle")
    _features.add("msil-run-netfx")
else:
    _features.discard("msil-native-oracle")
    _features.discard("msil-run-netfx")
