# Self-tests of P-1a's portable harness (plan 5.18.10, P-1a.m): the portable
# lit parameters, features and configuration errors of lit.cfg.py
# (lit-config.test), the 32-bit starts of msil-run.py (x86-runner.test), and
# the portable branches of the harness tools: update-expected.py
# (update-expected.test), the skip lines of msil-equiv.py and msil-prog.py
# (skip-lines.test), cli-corpus-check.py's O1 (corpus-o1.test), and
# gen-clibrary-names.py --check on lld/MSIL/CLibraryNames.def
# (clibrary-names.test). ../lit.local.cfg applies here too
# (%{harness_check}, %{harness_lit}, ...); Inputs/ holds the IL inputs, the PE
# reader, the suite that only a nested lit runs, the compiler stand-in of
# skip-lines.test and the envelope driver of corpus-o1.test.
import re

# %{portable_ilasm}: %ilasm without the trailing '-pe64 -x64' that lit.cfg.py
# gives every assembly, so the image is IL-only AnyCPU PE32 (machine I386),
# the envelope of an msil64 image (plan 5.18.7), which a 32-bit host can
# load. When %ilasm does not end in those flags (another assembler, a WSL
# runner), the substitution names no program and the tests that use it fail
# instead of testing a PE32+ image.
_ilasm = dict(config.substitutions).get("%ilasm", "")
_m = re.match(r"^(.*\S)\s+-pe64\s+-x64\s*$", _ilasm)
config.substitutions.append(
    ("%{portable_ilasm}", _m.group(1) if _m else "portable-ilasm-not-found")
)
