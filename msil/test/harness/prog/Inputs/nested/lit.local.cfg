# The suites that ../../pipelines.test, ../../lit-config.test,
# ../../deps.test and ../../../shlibs.test run in a nested lit: one-source.c
# is a C test (%{msil_c_O2}), one-ir.ll an IR test (%{msil_ll}), the rest
# are .test files. roundtrip/ holds the suites of
# ../../roundtrip.test, and m23/ those of ../../../copts-expect.test,
# ../../../also-run.test (also-run-obj.c) and ../../../default-pipeline.test
# (default-obj.c). Each test here that builds or writes anything is run by
# one outer test only: a nested run of a file works in that file's %t, the
# same Output/ files whichever outer test starts it, and msil-prog.py
# empties its work directory first, so two outer tests that the outer lit
# runs at the same time would delete each other's files. Only
# features.test, which writes nothing, is shared. lit.cfg.py keeps Inputs/
# out of the outer run's discovery.
import os

config.suffixes = [".c", ".ll", ".test"]

# The native leg of one-source.c under msil_pipeline=asm, and of one-ir.ll
# under asm and lto, is ../../../Inputs/pipeline-cc.py's, a .NET Framework
# executable, so the native-oracle and .NET Framework legs run here only where
# ../../../pipeline runs them: a Windows triple on the local runner with the
# .NET Framework.
_windir = os.environ.get("WINDIR") or os.environ.get("SystemRoot") or r"C:\Windows"
_netfx_ilasm = os.path.join(
    _windir, "Microsoft.NET", "Framework64", "v4.0.30319", "ilasm.exe"
)
if not (
    lit_config.params.get("msil_runner", "local") == "local"
    and {"msil-triple-windows", "msil-netfx"} <= config.available_features
    and os.path.isfile(_netfx_ilasm)
):
    config.available_features.discard("msil-native-oracle")
    config.available_features.discard("msil-run-netfx")
