# The suites of ../../../../ref-flags.test, ../../../../skip-peverify.test and
# ../../../o6-skip.test (M21): the reference flags of msil_references, the
# PEVerify skip of the .NET 8 and 10 reference legs and the O6 skip lines.
# Each of those tests runs files of its own (refs-*, skip-c.c, o6-c.c), so
# when lit runs them at the same time their nested runs never share Output/
# files. As in ../../../../pipeline-obj, ../../prog-cc.py also stands in for
# the -S compile of O3's and O6's reference build under msil_equiv=1, so the
# stand-in image and its reference describe the same program.
import os

_triple = dict(config.substitutions)["%msil_triple"]
_stand_in = "%s %s" % (
    '"%s"' % config.python_executable.replace("\\", "/"),
    '"%s"'
    % os.path.join(
        os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__)))),
        "prog-cc.py",
    ).replace("\\", "/"),
)
_replace = {
    "%clang_msil": "%s --as cc --target=%s" % (_stand_in, _triple),
    "%llc_msil": "%s --as llc -mtriple=%s" % (_stand_in, _triple),
}
config.substitutions = [(k, _replace.get(k, v)) for k, v in config.substitutions]
