# Run in a nested lit by ../../../ctest-lists.test only, for its executing
# case (M23): as ../../../Inputs/nested-ctest, this directory runs the
# lit.local.cfg of the copy of msil/test/Programs/c-testsuite that --param
# msil_ctest_copy names (../../../Inputs/ctest-lists.py setup ... exec makes
# it), so the copy's format yields this directory's tests from the copy's
# list and runs them from the copy's ctest.template. Here, below
# ../../lit.local.cfg, %{msil_prog} and %{msil_prog_fail_<L>} build with the
# stand-ins of ../prog-cc.py, whose compiler, with $PROG_CC_CTEST, accepts
# only c-testsuite's flags (-std=gnu17 -w).
import os

_copy = lit_config.params.get("msil_ctest_copy")
if not _copy:
    lit_config.fatal("harness/prog/Inputs/nested-ctest needs --param msil_ctest_copy=DIR")
config.environment["PROG_CC_CTEST"] = "1"
_cfg = os.path.join(os.path.abspath(_copy), "lit.local.cfg")
with open(_cfg, encoding="utf-8") as _f:
    _code = compile(_f.read(), _cfg, "exec")
exec(_code, {"__file__": _cfg, "config": config, "lit_config": lit_config})
