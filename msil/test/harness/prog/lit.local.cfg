# Self-tests of the multi-TU composites of lit.cfg.py (%{msil_prog},
# %{msil_prog_<L>}, %{msil_prog_fail_<L>}, %{msil_det}, %msil_prog_build), of
# msil/utils/msil-prog.py and of update-expected.py's %{msil_prog} tests (plan
# 5.12.3, 5.12.4; M14). Like ../pipeline, they need no compiler and no
# linker: %msil_prog_build runs msil-prog.py with the stand-ins of
# Inputs/prog-cc.py for clang (and msil-ld behind it), llvm-ar and the E7
# oracle's ld.lld, and every other step (ilasm, msil-verify, jitall,
# msil-run, the --expect comparison and the round trip of msil_roundtrip=1)
# is the real one. %clang_msil, %llc_msil and %clang_native are
# ../Inputs/pipeline-cc.py, as in ../pipeline, for the asm expansion of
# %{msil_c} in the nested runs of Inputs/.
# This directory pins the expansions of %{msil_prog}, %{msil_c} and
# %{msil_ldflags} and msil-prog.py's commands (plan 5.6.1 rule 6, 5.6.9), so
# a milestone that changes them owns it.
import os
import platform
import re
import subprocess

config.suffixes = [".test"]

_features = config.available_features
_params = lit_config.params
_dir = os.path.dirname(os.path.abspath(__file__))
_harness_dir = os.path.dirname(_dir)


def _quote(path):
    return '"%s"' % path.replace("\\", "/")


_python = _quote(config.python_executable)
_triple = dict(config.substitutions)["%msil_triple"]
_native_triple = _triple[: -len("-msil")]
_windir = os.environ.get("WINDIR") or os.environ.get("SystemRoot") or r"C:\Windows"
_netfx_ilasm = os.path.join(
    _windir, "Microsoft.NET", "Framework64", "v4.0.30319", "ilasm.exe"
)
_has_netfx_ilasm = os.path.isfile(_netfx_ilasm)
_stand_in = "%s %s" % (_python, _quote(os.path.join(_dir, "Inputs", "prog-cc.py")))
# The stand-in's Windows "native" programs are .NET Framework executables.
_clang = _stand_in + " --as cc"
if _has_netfx_ilasm:
    _clang += " --ilasm " + _quote(_netfx_ilasm)

# %msil_prog_build with the stand-ins (lit.cfg.py builds it from the same
# template and tool arguments; msil-ld stays the configured one, which the
# stand-in only records).
_tools = dict(config.msil_prog_tool_args)
_tools["clang"] = "--clang='%s'" % _clang
_tools["ar"] = "--ar='%s --as ar'" % _stand_in
if "ld-lld" in _tools:
    _tools["ld-lld"] = "--ld-lld='%s --as ld-lld'" % _stand_in
_pipeline_cc = "%s %s" % (
    _python,
    _quote(os.path.join(_harness_dir, "Inputs", "pipeline-cc.py")),
)
_replace = {
    "%msil_prog_build": config.msil_prog_template.replace(
        "@TOOLS@", " ".join(_tools[k] for k in sorted(_tools))
    ),
    "%clang_msil": "%s --as clang-msil --target=%s" % (_pipeline_cc, _triple),
    "%llc_msil": "%s --as llc-msil -mtriple=%s" % (_pipeline_cc, _triple),
    "%clang_native": "%s --as clang-native --ilasm %s --target=%s"
    % (_pipeline_cc, _quote(_netfx_ilasm), _native_triple),
}
config.substitutions = [(k, _replace.get(k, v)) for k, v in config.substitutions]
# The stand-ins themselves, for tests that run msil-prog.py or
# update-expected.py directly.
config.substitutions.append(("%{prog_cc}", _stand_in))
config.substitutions.append(("%{prog_clang}", _clang))
config.substitutions.append(
    ("%{prog_split_file}", _quote(os.path.join(config.llvm_tools_dir, "split-file")))
)
# The native leg's program is prog.elf when it is the E7 Linux oracle's.
config.substitutions.append(
    ("%{prog_native_ext}", "elf" if "ld-lld" in _tools else "exe")
)

# The levels the composites run, as features for the checks after them
# (msil-opt-<L>, as in ../pipeline).
_levels = [
    o.strip() for o in _params.get("msil_opt_levels", "O0,O2").split(",") if o.strip()
]
for _o in _levels:
    _features.add("msil-opt-" + _o)

# The legs run where the stand-in's native program runs, whatever
# msil_native_oracle and msil_run_netfx say: a .NET Framework executable for a
# Windows triple on a Windows host (local runner), a shell script for a Linux
# triple on a Linux host or under the WSL runner (E7's ld.lld, or the
# driver's link when the WSL leg has no native oracle). The .NET Framework leg
# needs the local runner on Windows.
_runner = _params.get("msil_runner", "local")
_host_windows = os.name == "nt"
_native_ok = (
    _runner == "local"
    and _host_windows
    and "msil-triple-windows" in _features
    and _has_netfx_ilasm
) or ("msil-triple-linux" in _features and (_runner == "wsl" or not _host_windows))
if _native_ok:
    _features.add("msil-native-oracle")
else:
    _features.discard("msil-native-oracle")
if _runner == "local" and "msil-netfx" in _features:
    _features.add("msil-run-netfx")
else:
    _features.discard("msil-run-netfx")


# Feature msil-roundtrip-tools (roundtrip.test): the host RID's .NET ildasm
# and ilasm at the version msil/utils/tools/msil-tools.proj pins
# (MsilILAsmVersion) are in a NuGet global-packages folder, so a nested lit
# with --param msil_roundtrip=1 loads instead of stopping with lit.cfg.py's
# fatal error. They are found as lit.cfg.py and ../legs/lit.local.cfg find
# them: $NUGET_PACKAGES, the folder that 'dotnet nuget locals global-packages
# --list' reports (dotnet reads its own configuration; this file never reads
# NuGet.Config) and ~/.nuget/packages. The gates and CI restore them; a
# development host without the restore skips the test. A configuration that
# already has feature msil-roundtrip (msil_roundtrip=1) has them.
def _roundtrip_tools():
    if "msil-roundtrip" in _features:
        return True
    proj = os.path.join(config.msil_src_root, "utils", "tools", "msil-tools.proj")
    try:
        with open(proj, encoding="utf-8") as f:
            m = re.search(
                r"<MsilILAsmVersion[^>]*>\s*([0-9.]+)\s*</MsilILAsmVersion>", f.read()
            )
    except OSError:
        return False
    if not m:
        return False
    version = m.group(1)
    rid = {"Windows": "win", "Linux": "linux", "Darwin": "osx"}.get(
        platform.system(), ""
    ) + ("-arm64" if platform.machine().lower() in ("arm64", "aarch64") else "-x64")
    exe = ".exe" if rid.startswith("win-") else ""

    def found(roots):
        """Both tools are runnable in one of roots (NuGet lower-cases the
        package ids in the folder)."""
        for tool in ("ildasm", "ilasm"):
            package = "runtime.%s.microsoft.netcore.%s" % (rid, tool)
            paths = [
                os.path.join(r, package, version, "runtimes", rid, "native", tool + exe)
                for r in roots
                if r
            ]
            if not any(os.path.isfile(p) and os.access(p, os.X_OK) for p in paths):
                return False
        return True

    roots = [
        os.environ.get("NUGET_PACKAGES"),
        os.path.join(os.path.expanduser("~"), ".nuget", "packages"),
    ]
    if found(roots):
        return True
    dotnet = dict(config.substitutions).get("%dotnet", "").strip('"')
    if not dotnet or dotnet == "dotnet-not-found":
        return False
    try:
        res = subprocess.run(
            [dotnet, "nuget", "locals", "global-packages", "--list"],
            stdin=subprocess.DEVNULL,
            stdout=subprocess.PIPE,
            stderr=subprocess.STDOUT,
            timeout=120,
        )
    except (OSError, subprocess.SubprocessError):
        return False
    folder = re.search(
        r"^global-packages:\s*(.+?)\s*$", res.stdout.decode("utf-8", "replace"), re.M
    )
    return res.returncode == 0 and bool(folder) and found(roots + [folder.group(1)])


if _roundtrip_tools():
    _features.add("msil-roundtrip-tools")
