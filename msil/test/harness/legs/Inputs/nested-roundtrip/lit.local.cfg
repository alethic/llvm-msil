# Run only by a nested lit (../../roundtrip-composites.test): %{msil_c} and
# %{msil_ll} of lit.cfg.py, with ../../../Inputs/pipeline-cc.py standing in
# for %clang_msil and %llc_msil as in harness/pipeline (it "compiles" <test>.c
# or <test>.ll by copying <test>.il.in), so no clang or llc is needed. Every
# other substitution (ilasm, msil-verify and its --roundtrip, jitall,
# msil-run and the --expect comparison) is the real one. This suite has its
# own inputs, so that its nested runs never share Output files with those of
# harness/pipeline/jitall-runs.test.
import os

config.suffixes = [".c", ".ll"]

_harness_dir = os.path.dirname(
    os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
)
_triple = dict(config.substitutions)["%msil_triple"]
_stand_in = '"%s" "%s"' % (
    config.python_executable.replace("\\", "/"),
    os.path.join(_harness_dir, "Inputs", "pipeline-cc.py").replace("\\", "/"),
)
_replace = {
    "%clang_msil": "%s --as clang-msil --target=%s" % (_stand_in, _triple),
    "%llc_msil": "%s --as llc-msil -mtriple=%s" % (_stand_in, _triple),
}
config.substitutions = [(k, _replace.get(k, v)) for k, v in config.substitutions]

# The native-oracle and .NET Framework legs would run the real clang on the
# stand-in's inputs; harness/pipeline tests them.
config.available_features.discard("msil-native-oracle")
config.available_features.discard("msil-run-netfx")
