# Self-tests of the M10 leg features of the harness (plan M10.c): the
# ildasm -> ilasm round trip of msil-verify.py --roundtrip (%msil_roundtrip,
# the round-trip leg), --param msil_require_exec=1 (M1/lit.local.cfg),
# --param msil_wsl_ilasm (the Linux assembler leg) and msil-run.py --tool
# --runner wsl, and (M23) the CI-only corpus paths of msil/utils/ci's
# lit-legs.ps1 and lit-legs.sh. They test the failure paths: a round trip
# that changes the listing or that ilasm cannot reassemble fails, and a
# missing tool or a parameter that cannot work is a configuration error, so a
# regression cannot turn a leg into one that passes without checking
# anything. They also test
# the wiring of the two legs in lit.cfg.py: --param msil_roundtrip=1 adds the
# round trip to %{msil_c} and %{msil_ll}, and --param msil_wsl_ilasm makes
# %ilasm run that ilasm inside WSL. ../lit.local.cfg applies here too
# (%{harness_check}, %{harness_lit}, ...); Inputs/ holds the IL inputs, the
# stand-in ilasm and the suites that only a nested lit runs.
import os
import platform
import re
import subprocess
import sys

import lit.util

_verify = dict(config.substitutions).get("%msil_verify", "")


def _option(name):
    """The value of '--<name> VALUE' in %msil_verify, as lit.cfg.py quoted it."""
    m = re.search(r"\s--%s (\"[^\"]*\"|\S+)" % re.escape(name), _verify)
    return m.group(1) if m else None


# %{legs_ildasm} and %{legs_ilasm}: the ildasm and ilasm of the neutralized
# pass of msil-verify.py (pass 2), which every gate has (msil_require_verify=1
# demands them). The round-trip tests run %msil_roundtrip with these, so they
# do not need --param msil_roundtrip=1 and its NuGet pair. lit.cfg.py adds
# them to %msil_verify when the features msil-ilverify, msil-ildasm and
# msil-ilasm are all present, which is what those tests REQUIRE; if the
# options cannot be found there, the substitutions name no program and the
# tests fail instead of passing or going UNSUPPORTED unnoticed.
_ildasm = _option("ildasm")
_ilasm = _option("ilasm")
config.substitutions.append(("%{legs_ildasm}", _ildasm or "legs-ildasm-not-found"))
config.substitutions.append(("%{legs_ilasm}", _ilasm or "legs-ilasm-not-found"))

# Feature msil-netfx-ildasm: that ildasm is the .NET Framework 4.8 one from
# the Windows SDK's 'NETFX 4.x Tools' (lit.cfg.py's default on Windows), which
# prints infinite FP constants as 'inf' (recon cil-runtime.md 15).
if _ildasm and re.search(r"[\\/]NETFX [0-9.]+ Tools[\\/]", _ildasm, re.IGNORECASE):
    config.available_features.add("msil-netfx-ildasm")

# %{legs_msil_run}: msil-run.py itself, for the --tool --runner wsl test
# (%ilasm and %msil_exec add options of their own); %{legs_wsl_distro}: the
# WSL distribution of --param msil_wsl_distro.
config.substitutions.append(
    (
        "%{legs_msil_run}",
        '"%s" "%s"'
        % (
            config.python_executable.replace("\\", "/"),
            os.path.join(config.msil_src_root, "utils", "msil-run.py").replace(
                "\\", "/"
            ),
        ),
    )
)
config.substitutions.append(
    ("%{legs_wsl_distro}", lit_config.params.get("msil_wsl_distro", "Ubuntu"))
)

# The levels %{msil_c} and %{msil_ll} run, as features for the checks of
# roundtrip-composites.test, as in ../pipeline/lit.local.cfg: msil-opt-<L>
# for %{msil_c} (msil_opt_levels), msil-ll-opt-<L> for %{msil_ll} (the llc
# levels among them, else O2, as in lit.cfg.py).
_levels = [
    o.strip()
    for o in lit_config.params.get("msil_opt_levels", "O0,O2").split(",")
    if o.strip()
]
for _o in _levels:
    config.available_features.add("msil-opt-" + _o)
for _o in [o for o in _levels if o in ("O0", "O1", "O2", "O3")] or ["O2"]:
    config.available_features.add("msil-ll-opt-" + _o)

# The .NET ildasm and ilasm at the version msil/utils/tools/msil-tools.proj
# pins (MsilILAsmVersion), from a NuGet global-packages folder, found the way
# lit.cfg.py finds them (pinned_tools_version(), nuget_roots(),
# nuget_tool_path()): $NUGET_PACKAGES, the folder that 'dotnet nuget locals
# global-packages --list' reports (dotnet reads its own configuration; this
# file never reads NuGet.Config) and ~/.nuget/packages, in that order.
# - Feature msil-roundtrip-tools: the host RID's ildasm and ilasm are there,
#   so a nested lit with --param msil_roundtrip=1 loads instead of stopping
#   with lit.cfg.py's fatal error (roundtrip-composites.test). The gates and
#   CI restore them; a development host without the restore skips the test.
# - Feature msil-pinned-linux-ilasm and %{legs_linux_ilasm}: the linux-x64
#   ilasm that the wsl-ilasm leg passes as --param msil_wsl_ilasm
#   (wsl-ilasm-runs.test).
# - %{legs_tools_version}: that version.
_host_rid = {"Windows": "win", "Linux": "linux", "Darwin": "osx"}.get(
    platform.system(), ""
) + ("-arm64" if platform.machine().lower() in ("arm64", "aarch64") else "-x64")


def _pinned_tools_version():
    proj = os.path.join(config.msil_src_root, "utils", "tools", "msil-tools.proj")
    try:
        with open(proj, encoding="utf-8") as f:
            m = re.search(
                r"<MsilILAsmVersion[^>]*>\s*([0-9.]+)\s*</MsilILAsmVersion>", f.read()
            )
    except OSError:
        return None
    return m.group(1) if m else None


def _nuget_roots():
    roots = [
        os.environ.get("NUGET_PACKAGES"),
        os.path.join(os.path.expanduser("~"), ".nuget", "packages"),
    ]
    dotnet = dict(config.substitutions).get("%dotnet", "").strip('"')
    if dotnet and dotnet != "dotnet-not-found":
        try:
            res = subprocess.run(
                [dotnet, "nuget", "locals", "global-packages", "--list"],
                stdin=subprocess.DEVNULL,
                stdout=subprocess.PIPE,
                stderr=subprocess.STDOUT,
                timeout=120,
            )
            m = re.search(
                r"^global-packages:\s*(.+?)\s*$",
                res.stdout.decode("utf-8", "replace"),
                re.M,
            )
            if res.returncode == 0 and m:
                roots.insert(1, m.group(1))
        except (OSError, subprocess.SubprocessError):
            pass
    return [r for r in roots if r]


def _pinned_tool(roots, tool, rid, version):
    """The first runnable runtime.<rid>.microsoft.netcore.<tool>/<version>."""
    for root in roots:
        path = os.path.join(
            root,
            "runtime.%s.microsoft.netcore.%s" % (rid, tool),
            version,
            "runtimes",
            rid,
            "native",
            tool + (".exe" if rid.startswith("win-") else ""),
        )
        if os.path.isfile(path) and os.access(path, os.X_OK):
            return path
    return None


_version = _pinned_tools_version()
_linux_ilasm = None
if _version:
    _roots = _nuget_roots()
    if all(_pinned_tool(_roots, t, _host_rid, _version) for t in ("ildasm", "ilasm")):
        config.available_features.add("msil-roundtrip-tools")
    _linux_ilasm = _pinned_tool(_roots, "ilasm", "linux-x64", _version)
    if _linux_ilasm:
        config.available_features.add("msil-pinned-linux-ilasm")
config.substitutions.append(("%{legs_tools_version}", _version or "no-version"))
config.substitutions.append(
    (
        "%{legs_linux_ilasm}",
        (_linux_ilasm or "legs-linux-ilasm-not-found").replace("\\", "/"),
    )
)

# ci-legs-corpus.test and ci-legs-corpus-sh.test run msil/utils/ci/lit-legs.ps1
# and lit-legs.sh against a stand-in build directory (Inputs/ci-legs.py).
# Feature msil-ci-pwsh: Windows with pwsh (lit-legs.ps1 dot-sources
# msil-env.ps1, the Windows developer environment). Feature msil-ci-bash:
# lit-legs.sh can run, inside WSL from Windows when msil-wsl is set (the WSL
# legs, msil_runner=wsl), or natively on Linux with bash. VSCMD_ARG_TGT_ARCH
# is passed on, so msil-env.ps1 sees the x64 developer environment that lit
# runs in (the CI's msvc-dev-cmd, or msil-env.ps1 in the gates' scripts) and
# does not enter it again.
if sys.platform == "win32" and "pwsh" in config.available_features:
    config.available_features.add("msil-ci-pwsh")
if (sys.platform == "win32" and "msil-wsl" in config.available_features) or (
    sys.platform.startswith("linux") and lit.util.which("bash")
):
    config.available_features.add("msil-ci-bash")
if "VSCMD_ARG_TGT_ARCH" in os.environ:
    config.environment["VSCMD_ARG_TGT_ARCH"] = os.environ["VSCMD_ARG_TGT_ARCH"]
