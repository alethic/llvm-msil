# The suites that ../../*.test run in nested lits with --param
# msil_pipeline=obj: prog-c.c, equiv-c.c and level-c.c are C tests (%{msil_c},
# %{msil_c_<L>}), prog-ir.ll and level-ir.ll IR tests (%{msil_ll},
# %{msil_ll_<L>}), prog-two.test a %{msil_prog} test; copts-c.c is the C
# test that ../../../copts-expect.test runs under obj with msil_equiv=1 and
# under asm (M23). lit.cfg.py keeps Inputs/ out of the outer run's
# discovery; ../../lit.local.cfg puts the stand-ins in place here too.
config.suffixes = [".c", ".ll", ".test"]
