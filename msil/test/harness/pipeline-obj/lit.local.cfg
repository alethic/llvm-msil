# Self-tests of the composites of lit.cfg.py under msil_pipeline=obj (plan
# 5.12.1, 5.12.3, 5.12.6; M20): %{msil_c}, %{msil_ll} and their per-level
# forms as one-source programs through CIL objects and msil-ld, with and
# without msil_equiv=1 (the equivalence link, the -S reference build, O3 and
# O6), and %{msil_prog} under obj. Like ../pipeline and ../prog, they need no
# compiler and no linker: the tests run nested lits with --param
# msil_pipeline=obj on the suites of Inputs/, in which ../prog/Inputs/prog-cc.py
# stands in for clang (-c, -S, the msil-ld link and the native build), llc
# (-filetype=obj and text), llvm-ar and the E7 oracle's ld.lld, so that every
# other step (ilasm, msil-verify with --md-baseline, jitall, msil-run, the
# --expect comparison and msil-equiv.py with the tree's %msil_canon) is the
# real one. The stand-in's msil-ld image and its -S text describe the same
# program, so O3 and O6 hold for them; what these tests pin is the commands
# the composites run and that each step's result reaches the next.
# This directory pins every obj expansion of %{msil_c} and %{msil_ll} (plan
# 5.6.1 rule 6, M20.f), so a milestone that changes them owns it.
import os

config.suffixes = [".test"]

_features = config.available_features
_params = lit_config.params
_dir = os.path.dirname(os.path.abspath(__file__))
_harness_dir = os.path.dirname(_dir)


def _quote(path):
    return '"%s"' % path.replace("\\", "/")


_triple = dict(config.substitutions)["%msil_triple"]
_native_triple = _triple[: -len("-msil")]
_windir = os.environ.get("WINDIR") or os.environ.get("SystemRoot") or r"C:\Windows"
_netfx_ilasm = os.path.join(
    _windir, "Microsoft.NET", "Framework64", "v4.0.30319", "ilasm.exe"
)
_has_netfx_ilasm = os.path.isfile(_netfx_ilasm)
_stand_in = "%s %s" % (
    _quote(config.python_executable),
    _quote(os.path.join(_harness_dir, "prog", "Inputs", "prog-cc.py")),
)
# The stand-in's Windows "native" programs are .NET Framework executables.
_clang = _stand_in + " --as cc"
if _has_netfx_ilasm:
    _clang += " --ilasm " + _quote(_netfx_ilasm)
_tools = dict(config.msil_prog_tool_args)
_tools["clang"] = "--clang='%s'" % _clang
_tools["ar"] = "--ar='%s --as ar'" % _stand_in
if "ld-lld" in _tools:
    _tools["ld-lld"] = "--ld-lld='%s --as ld-lld'" % _stand_in
_replace = {
    "%msil_prog_build": config.msil_prog_template.replace(
        "@TOOLS@", " ".join(_tools[k] for k in sorted(_tools))
    ),
    "%{msil_llc}": "'%s --as llc'" % _stand_in,
    "%clang_msil": "%s --as cc --target=%s" % (_stand_in, _triple),
    "%llc_msil": "%s --as llc -mtriple=%s" % (_stand_in, _triple),
    "%clang_native": "%s --target=%s" % (_clang, _native_triple),
}
config.substitutions = [(k, _replace.get(k, v)) for k, v in config.substitutions]
# The ilasm that assembles the stand-in's msil-ld images.
config.environment["PROG_CC_ILASM"] = getattr(config, "msil_ilasm", None) or ""
config.environment["PROG_CC_ILASM_FLAGS"] = " ".join(
    getattr(config, "msil_ilasm_flags", [])
)

# The levels the composites run, as features for the checks after them:
# msil-opt-<L> for %{msil_c} (msil_opt_levels), msil-ll-opt-<L> for %{msil_ll}
# (the llc levels among them, else O2, as in lit.cfg.py).
_levels = [
    o.strip() for o in _params.get("msil_opt_levels", "O0,O2").split(",") if o.strip()
]
for _o in _levels:
    _features.add("msil-opt-" + _o)
for _o in [o for o in _levels if o in ("O0", "O1", "O2", "O3")] or ["O2"]:
    _features.add("msil-ll-opt-" + _o)

# The stand-in's native program is a .NET Framework executable, so the
# native-oracle and .NET Framework legs run only where a Windows triple runs
# on the local runner with the .NET Framework; there they are on whatever
# msil_native_oracle and msil_run_netfx say (they are part of what is pinned),
# and they are off everywhere else.
if (
    _params.get("msil_runner", "local") == "local"
    and {"msil-triple-windows", "msil-netfx"} <= _features
    and _has_netfx_ilasm
):
    _features.add("msil-native-oracle")
    _features.add("msil-run-netfx")
else:
    _features.discard("msil-native-oracle")
    _features.discard("msil-run-netfx")
