# The suite that ../../run-inputs.test runs in a nested lit (plan 5.17.2,
# M27: %{msil_run_opts} and %{msil_run_args}). Its %{msil_prog} tests build
# with the stand-ins of ../../prog/Inputs/prog-cc.py, so this directory runs
# ../../prog/lit.local.cfg, as lit runs it for ../../prog: every step after
# the build (verify, jitall, the runs and the transcript comparison) is the
# real one. The explicit-RUN tests assemble args-stdin.il, whose exit status
# tells how many arguments and which stdin digit the program received. Each
# test here is run by one outer test only (run-inputs.test), as in
# ../../prog/Inputs/nested. lit.cfg.py keeps Inputs/ out of the outer run's
# discovery.
import os

_prog_cfg = os.path.join(
    os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__)))),
    "prog",
    "lit.local.cfg",
)
with open(_prog_cfg, encoding="utf-8") as _f:
    _code = compile(_f.read(), _prog_cfg, "exec")
exec(_code, {"__file__": _prog_cfg, "config": config, "lit_config": lit_config})
config.suffixes = [".test"]
