# Run in a nested lit by ../../ctest-lists.test (M23, M24): this directory
# runs the lit.local.cfg of the copy of msil/test/Programs/c-testsuite that
# --param msil_ctest_copy names (Inputs/ctest-lists.py setup makes it), as
# lit would run it for that directory, so its checks of libc-free.txt and
# libc.txt against the cached tree run on the copy's lists and on the fake
# corpus of --param msil_corpus_dir, and the copy's format yields this
# directory's tests. --param msil_ctest_drop=hosted first removes
# config.msil_enable_hosted, and msil_ctest_drop=subst the substitutions
# %{msil_hosted_cflags} and %{msil_oracle_flags}, as a lit.cfg.py from
# before M24 would lack them, so the test can pin the errors of a libc.txt
# that the configuration cannot run (plan 5.17.3, 5.17.14).
import os

_copy = lit_config.params.get("msil_ctest_copy")
if not _copy:
    lit_config.fatal("harness/Inputs/nested-ctest needs --param msil_ctest_copy=DIR")
_drop = lit_config.params.get("msil_ctest_drop", "")
if _drop == "hosted":
    if hasattr(config, "msil_enable_hosted"):
        del config.msil_enable_hosted
elif _drop == "subst":
    config.substitutions = [
        (k, v)
        for k, v in config.substitutions
        if k not in ("%{msil_hosted_cflags}", "%{msil_oracle_flags}")
    ]
elif _drop:
    lit_config.fatal("harness/Inputs/nested-ctest: msil_ctest_drop is hosted or subst")
_cfg = os.path.join(os.path.abspath(_copy), "lit.local.cfg")
with open(_cfg, encoding="utf-8") as _f:
    _code = compile(_f.read(), _cfg, "exec")
exec(_code, {"__file__": _cfg, "config": config, "lit_config": lit_config})
