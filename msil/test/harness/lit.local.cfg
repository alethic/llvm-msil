# Self-tests of the MSIL execution harness: msil-run.py (%msil_exec),
# msil-verify.py (%msil_verify), msil-jitall.py (%msil_jitall),
# update-expected.py, the gate scripts msil-expect-error.ps1 and
# msil-gtest.ps1, and the lit configuration that wires them together. The
# inputs are hand-written IL in the Phase-1 output shape (plan section 5.1),
# so these tests need ilasm and a .NET runtime, but not clang or llc.
import os
import sys

import lit.util

if not {"msil-ilasm", "msil-dotnet"} <= config.available_features:
    config.unsupported = True

# Only the .test files are tests; Inputs/ holds the IL sources, the expected
# transcripts, harness-check.py and the small suites that nested lit runs use.
config.suffixes = [".test"]

_harness_dir = os.path.dirname(os.path.abspath(__file__))
_msil_dir = os.path.dirname(os.path.dirname(_harness_dir))
_python = getattr(config, "python_executable", None) or sys.executable


def _quote(path):
    return '"%s"' % path.replace("\\", "/")


# M0 builds no LLVM tools, so there is no FileCheck: text checks (and the
# wall-clock bound of timeout.test) go through Inputs/harness-check.py.
config.substitutions.append(
    (
        "%{harness_check}",
        "%s %s"
        % (
            _quote(_python),
            _quote(os.path.join(_harness_dir, "Inputs", "harness-check.py")),
        ),
    )
)
config.substitutions.append(
    (
        "%{harness_update_expected}",
        "%s %s"
        % (
            _quote(_python),
            _quote(os.path.join(_msil_dir, "utils", "update-expected.py")),
        ),
    )
)

# The gate scripts msil-expect-error.ps1 and msil-gtest.ps1 (plan M0.a) run
# under PowerShell 7; feature 'pwsh' when it is on PATH.
_pwsh = lit.util.which("pwsh")
if _pwsh:
    config.available_features.add("pwsh")
    for _sub, _script in (
        ("%{harness_expect_error}", "msil-expect-error.ps1"),
        ("%{harness_gtest}", "msil-gtest.ps1"),
    ):
        config.substitutions.append(
            (
                _sub,
                "%s -NoProfile -NonInteractive -File %s"
                % (
                    _quote(_pwsh),
                    _quote(os.path.join(_msil_dir, "utils", "build", _script)),
                ),
            )
        )

# %{harness_lit} runs a nested llvm-lit of this build on a suite under
# Inputs/ (lit.cfg.py excludes Inputs/ from discovery), to test what lit.cfg.py
# itself does with its parameters. It passes on the parameters that select
# the tools, the runner and the limits, so the nested run tests the same
# configuration as this one; the parameters under test (msil_dotnet_env,
# msil_require_verify, ...) come after them and win. It passes on neither
# msil_pipeline nor msil_link_output, so a nested run without them has the
# default pipeline (obj from M23; default-pipeline.test), and a test of
# another pipeline names it. It never writes .lit_test_times.txt, which the
# outer run owns. It passes on the parent's msil_probe_cache (M24, plan
# 5.17.10), so the nested runs read and write the parent's probe cache; a
# self-test whose nested run makes a probe fail (a missing or broken tool)
# passes msil_probe_cache= (empty) after it, so that run neither reads the
# cache nor replaces it with its own probes (probe-cache.test).
_PASSED_ON = (
    "msil_triple",
    "msil_runner",
    "msil_wsl_distro",
    "msil_dotnet_runtime",
    "msil_opt_levels",
    "msil_timeout",
    "msil_mem_limit_mb",
    "msil_ilasm",
    "msil_dotnet",
    "msil_ilverify",
    "msil_peverify",
    "msil_ildasm",
    "msil_jitall",
    "msil_mdcanon",
    "msil_cil_dump",
    "msil_probe_cache",
)
for _name in ("llvm-lit.py", "llvm-lit"):
    _lit = os.path.join(config.llvm_obj_root, "bin", _name)
    if os.path.isfile(_lit):
        break
_params = "".join(
    ' "--param=%s=%s"' % (k, v.replace("\\", "/"))
    for k, v in sorted(lit_config.params.items())
    if k in _PASSED_ON
)
config.substitutions.append(
    (
        "%{harness_lit}",
        "%s %s -v --skip-test-time-recording%s"
        % (_quote(_python), _quote(_lit), _params),
    )
)

# Feature msil-default-limits: neither msil_timeout nor msil_mem_limit_mb is
# given, so the tool limits are lit.cfg.py's defaults, and limits-redefine.test
# pins msil_timeout's 60 seconds (plan 5.17.9: it stays 60 s in every leg).
if not {"msil_timeout", "msil_mem_limit_mb"} & set(lit_config.params):
    config.available_features.add("msil-default-limits")

# Feature msil-linux-syntax-check (M26): 'linux-syntax-check.py
# --check-toolchain' finds the fetched clang 18 toolchain current, so
# linux-syntax-check.test runs without downloading it. The check never
# fetches; a missing <toolchain>/linux-syntax-check.stamp skips it, and any
# exception, timeout or non-zero exit leaves the feature off. The toolchain
# directory is the script's: $MSIL_LINUX_CLANG18, else
# C:/llvm-msil-scratch/linux-clang18 on Windows and
# ~/llvm-msil-scratch/linux-clang18 elsewhere; the variable is passed on to
# the tests, so the test's runs look where this check looked. On Windows the
# compiles run inside WSL, so the feature also needs wsl.exe on PATH.
_linux_tc = os.environ.get("MSIL_LINUX_CLANG18")
if _linux_tc:
    config.environment["MSIL_LINUX_CLANG18"] = _linux_tc
elif os.name == "nt":
    _linux_tc = "C:/llvm-msil-scratch/linux-clang18"
else:
    _linux_tc = os.path.join(
        os.path.expanduser("~"), "llvm-msil-scratch", "linux-clang18"
    )
if os.path.isfile(os.path.join(_linux_tc, "linux-syntax-check.stamp")) and (
    os.name != "nt" or lit.util.which("wsl.exe") or lit.util.which("wsl")
):
    try:
        import subprocess

        if (
            subprocess.run(
                [
                    _python,
                    os.path.join(_msil_dir, "utils", "ci", "linux-syntax-check.py"),
                    "--check-toolchain",
                    "--toolchain",
                    _linux_tc,
                ],
                stdin=subprocess.DEVNULL,
                stdout=subprocess.DEVNULL,
                stderr=subprocess.DEVNULL,
                timeout=30,
            ).returncode
            == 0
        ):
            config.available_features.add("msil-linux-syntax-check")
    except Exception:
        pass
