# Phase 3 (plan 5.17.13): the execution tests of the Phase 3 features, one
# directory per feature area, created by the milestone that implements it
# (10-hosted, 08-atomics/barrier-spin.test and 03-helpers/bitint-abi.test in
# M24).
#
# Every test links through msil-ld and runs, as in msil/test/M2: without the
# execution harness (feature msil-exec) or msil-ld (feature msil-ld) every
# test here is UNSUPPORTED rather than failing, except under
# --param msil_require_link=1 (every gate leg of msil/utils/ci), where that is
# a configuration error naming what is missing, so a gate leg never passes
# with every test here UNSUPPORTED. What is missing is named from the
# features msil-exec stands for, as ../M2/lit.local.cfg names it.
#
# Test rules (plan 5.17.13, with plan 5.5 and 5.12.5): a split-file .test
# with %{msil_prog}, or a single .c with %{msil_c} only when the program
# calls no native function outside the standalone import table of plan D14
# (puts, putchar and the C math functions); UB-free and the same output at
# every level; exit statuses in 0..255 (D37); .expected from
# update-expected.py with the Windows DLL C runtime oracle, .linux.expected
# from E7h where it differs; -O0 and -O2 on both triples; never XFAIL. A test
# may use a capability only from the milestone that provides it (plan
# 5.17.13's capability table: in M24 the real headers with the functions
# that bind natively today, and no printf family or other variadic call
# before M26).
_needs = [
    ("clang", "clang (LLVM_ENABLE_PROJECTS=clang; build the clang target)"),
    ("msil-registered-target", "the MSIL target (LLVM_EXPERIMENTAL_TARGETS_TO_BUILD=MSIL)"),
    ("msil-ilasm", "ilasm (--param msil_ilasm=PATH)"),
    ("msil-dotnet", "a .NET runtime for the selected runner"),
]
if "msil-pipeline=asm" not in config.available_features:
    _needs.append(
        ("msil-ar", "llvm-ar (build the llvm-ar target or pass --param msil_ar=PATH)")
    )
_needs.append(("msil-ld", "msil-ld (build the lld target; --param msil_ld=PATH)"))
_missing = [what for feature, what in _needs if feature not in config.available_features]
if "msil-exec" not in config.available_features and not _missing:
    # lit.cfg.py added every part but not msil-exec: name the feature itself.
    _missing = ["the execution harness (feature msil-exec)"]
if _missing:
    if getattr(config, "msil_require_link", False) or (
        "msil-exec" not in config.available_features
        and getattr(config, "msil_require_exec", False)
    ):
        lit_config.fatal(
            "msil: msil/test/M3 cannot run, but the leg requires it "
            "(msil_require_link=1 or msil_require_exec=1); missing: "
            + "; ".join(_missing)
        )
    config.unsupported = True

# Every directory here is hosted (plan 5.17.3): the tests include the real C
# library headers of the triple (glibc's from the sysroot of
# %{msil_glibc_sysroot} on Linux triples, the UCRT's of INCLUDE on Windows
# triples) and call the C library functions that bind natively, and their
# native oracle is the hosted one (E7h on Linux triples, the DLL C runtime on
# Windows triples). The marker line below makes lit build with the hosted
# %{msil_cflags} (no -ffreestanding) and %{msil_oracle_flags} = --hosted, and
# makes these tests UNSUPPORTED without the triple's headers (feature
# msil-hosted), or a configuration error under --param msil_require_hosted=1
# (every lit leg); update-expected.py reads the same line (gate-select.py
# counts every lit.local.cfg under msil/test as a harness file).
# It comes after the check above, so a configuration without the execution
# harness names that first.
config.msil_enable_hosted(config)
