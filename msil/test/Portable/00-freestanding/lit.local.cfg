# msil/test/Portable/00-freestanding (P-1a; plan 5.18.10 PX3): self-checking
# freestanding programs for msil64-unknown-dotnet, before the C library
# exists (P-1b). They are compiled with %{msil_cflags} (-ffreestanding) and
# linked with %{msil_portable_cflags} (-nolibc -ffreestanding, plan 5.18.4
# PV3): the link drops -lc, which nothing provides before P-1b, and keeps the
# helper archive clang_rt.builtins, whose members helpers.test calls. Every
# link of the directory reads %{msil_ldflags} (the program and the -shared
# libraries of %{msil_prog}, and the libraries a test links itself), so the
# flags go to its front here.
#
# One image per test and level runs on every runtime of the leg (.NET 10,
# msil_also_run's TieredCompilation=0 run, the .NET Framework 4.8 direct start,
# WSL .NET 10); guard-x86.test runs the same image under the 32-bit hosts.
# Programs have no output channel before P-2: each check that fails sets a bit
# of the exit status, and every expected file is '[exit 0]', hand-written
# under 5.17.4's portable allowance (see ../lit.local.cfg).
if not config.unsupported:
    _keys = [key for key, _ in config.substitutions]
    if "%{msil_portable_cflags}" not in _keys:
        lit_config.fatal(
            "msil: msil/test/Portable/00-freestanding needs lit.cfg.py's "
            "%{msil_portable_cflags} (plan 5.18.10 PX1), which this "
            "configuration does not define"
        )
    if "%{msil_ldflags}" not in _keys:
        lit_config.fatal(
            "msil: msil/test/Portable/00-freestanding needs lit.cfg.py's "
            "%{msil_ldflags}, which this configuration does not define"
        )
    config.substitutions = [
        (key, "%{msil_portable_cflags} " + value)
        if key == "%{msil_ldflags}"
        else (key, value)
        for key, value in config.substitutions
    ]
