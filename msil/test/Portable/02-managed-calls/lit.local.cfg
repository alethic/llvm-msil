# msil/test/Portable/02-managed-calls (MC-1; plan 5.20.11 MT3): managed calls
# from C on msil64-unknown-dotnet. Each program declares .NET members with
# __attribute__((msil_method(...))) (and msil_catch) and calls them; the
# stubs that the backend writes convert the arguments, call the member and
# convert the result (plan 5.20.5). No test passes --reference before P-2,
# so every member and type the programs name is an entry of msil-ld's
# built-in [mscorlib] table after MC-1's block (plan 5.20.13), and the same
# tests link in the Windows and the WSL portable legs.
#
# The programs link the managed C library c.dll from the portable sysroot
# (P-1b's freestanding strlen and memcmp, and its errno numbers): they
# compile with %{msil_cflags} minus -ffreestanding plus
# %{msil_portable_libc_cflags} (--sysroot=<the msil_portable_sysroot of
# lit.cfg.py>), every link of the directory reads %{msil_ldflags}, to whose
# front the same flag goes, and every run copies c.dll beside the program
# (%{msil_deps}), as in ../01-libc.
#
# Programs have no output channel before P-2: each failed check sets a bit
# of the exit status (plan D37), and a test whose program ends on an
# unlisted .NET exception (%{msil_prog_loud_<L>}) returns its failed checks
# before it gets there. Every expected file is hand-written under 5.17.4's
# portable allowance (see ../lit.local.cfg). The tests run only in the
# post-commit Portable legs (decision brief answers Q11 (a)); MC-1's own
# gate runs none of them.
#
# Without the sysroot (feature msil-portable-sysroot) the tests are
# UNSUPPORTED, except under --param msil_require_portable=1,
# msil_require_link=1 or msil_require_exec=1, where that is a configuration
# error naming build-libc.py.
import re

import lit.util

_DIR = "msil/test/Portable/02-managed-calls"


def _flag(name):
    try:
        return lit.util.pythonize_bool(lit_config.params.get(name, "0"))
    except ValueError:
        return False


if not config.unsupported:
    _subs = dict(config.substitutions)
    for _key in (
        "%{msil_portable_libc_cflags}",
        "%{msil_cflags}",
        "%{msil_ldflags}",
        "%{msil_deps}",
    ):
        if _key not in _subs:
            lit_config.fatal(
                "msil: %s needs lit.cfg.py's %s (plan 5.19.3, P-1b.c), which "
                "this configuration does not define" % (_DIR, _key)
            )
    if "msil-portable-sysroot" not in config.available_features:
        if (
            _flag("msil_require_portable")
            or getattr(config, "msil_require_link", False)
            or getattr(config, "msil_require_exec", False)
        ):
            lit_config.fatal(
                "msil: %s cannot run, but the leg requires it "
                "(msil_require_portable=1, msil_require_link=1 or "
                "msil_require_exec=1); missing: the portable sysroot with c.dll "
                "(python msil/utils/build/build-libc.py, or --param "
                "msil_portable_sysroot=DIR)" % _DIR
            )
        config.unsupported = True

if not config.unsupported:
    _flags = _subs["%{msil_portable_libc_cflags}"]
    _m = re.search(r'--sysroot=(?:"([^"]*)"|(\S+))', _flags)
    if not _m:
        lit_config.fatal(
            "msil: %s cannot find --sysroot= in %%{msil_portable_libc_cflags} "
            "(%r)" % (_DIR, _flags)
        )
    _sysroot = (_m.group(1) or _m.group(2)).replace("\\", "/").rstrip("/")
    _dll = _sysroot + "/lib/msil64-unknown-dotnet/c.dll"
    if " " in _dll:
        # %{msil_deps} is a list of words on the command line.
        _dll = '"%s"' % _dll

    def _hosted(cflags):
        # %{msil_cflags} without -ffreestanding: the programs are hosted C
        # against the sysroot's headers.
        return re.sub(r"(^|\s)-ffreestanding(?=\s|$)", r"\1", cflags).strip()

    _new = []
    for _key, _value in config.substitutions:
        if _key == "%{msil_cflags}":
            _value = _hosted(_value) + " %{msil_portable_libc_cflags}"
        elif _key == "%{msil_ldflags}":
            _value = "%{msil_portable_libc_cflags} " + _value
        elif _key == "%{msil_deps}":
            _value = _dll
        _new.append((_key, _value))
    config.substitutions = _new
