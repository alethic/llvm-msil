# msil/test/Portable (plan 5.18.10 PX3, PX4; P-1a): execution tests of the
# portable target msil64-unknown-dotnet, one directory per step:
# 00-freestanding (P-1a), then P-1b's 01-libc and 90-loud, MC-1's
# 02-managed-calls and 03-sjlj, and P-2's directories as they appear.
#
# The tests compile for the portable triple through the composites of
# lit.cfg.py, so they run only when lit's triple is the portable one
# (--param msil_triple=msil64-unknown-dotnet, feature msil-triple-portable):
# the two portable legs (portable-smoke and portable-smoke-wsl, tag Portable)
# and each P-step's own gate steps. Under a host triple every test here is
# UNSUPPORTED, so the host legs that take msil/test whole (net8, lto, p3-full,
# wsl-p3; net-core also filters out Portable/) neither run nor count them.
#
# Under the portable triple, every test needs the execution harness, msil-ld
# and the portable toolchain (feature msil-portable: the build's clang and
# msil-ld accept msil64-unknown-dotnet) with its helper archive (feature
# msil-portable-builtins: the driver links clang_rt.builtins by default). A
# missing part makes the tests UNSUPPORTED, except under
# --param msil_require_portable=1, msil_require_link=1 or msil_require_exec=1
# (the portable legs and the gate steps pass them), where it is a
# configuration error naming what is missing, so a leg never passes with
# every test here UNSUPPORTED.
#
# Test rules (plan 5.18.10 PX2, 5.17.4's portable allowance): a portable
# program has no native oracle before P-2, so every program checks itself
# (each failed check sets a bit of the exit status, plan D37) and its
# expected file is hand-written under
# %{msil_expected_rule} = windows,linux: portable: no stdout before P-2; the program checks itself
# UB-free C, the same status at every level; never XFAIL.
import lit.util

if "msil-triple-portable" not in config.available_features:
    config.unsupported = True
else:
    _needs = [
        ("clang", "clang (LLVM_ENABLE_PROJECTS=clang; build the clang target)"),
        ("msil-registered-target", "the MSIL target (LLVM_EXPERIMENTAL_TARGETS_TO_BUILD=MSIL)"),
        ("msil-ilasm", "ilasm (--param msil_ilasm=PATH)"),
        ("msil-dotnet", "a .NET runtime for the selected runner"),
        ("msil-ld", "msil-ld (build the lld target; --param msil_ld=PATH)"),
        (
            "msil-portable",
            "the portable toolchain (the build's clang and msil-ld accept "
            "msil64-unknown-dotnet)",
        ),
        (
            "msil-portable-builtins",
            "the portable helper archive (python msil/utils/build/build-builtins.py "
            "--triple msil64-unknown-dotnet)",
        ),
    ]
    if "msil-pipeline=asm" not in config.available_features:
        _needs.append(
            ("msil-ar", "llvm-ar (build the llvm-ar target or pass --param msil_ar=PATH)")
        )
    _missing = [what for feature, what in _needs if feature not in config.available_features]
    if "msil-exec" not in config.available_features and not _missing:
        # lit.cfg.py added every part but not msil-exec: name the feature itself.
        _missing = ["the execution harness (feature msil-exec)"]
    if _missing:

        def _flag(name):
            try:
                return lit.util.pythonize_bool(lit_config.params.get(name, "0"))
            except ValueError:
                return False

        if (
            _flag("msil_require_portable")
            or getattr(config, "msil_require_link", False)
            or getattr(config, "msil_require_exec", False)
        ):
            lit_config.fatal(
                "msil: msil/test/Portable cannot run, but the leg requires it "
                "(msil_require_portable=1, msil_require_link=1 or "
                "msil_require_exec=1); missing: " + "; ".join(_missing)
            )
        config.unsupported = True
