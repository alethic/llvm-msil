# msil/test/Portable/01-libc (P-1b; plan 5.19.15): self-checking programs
# for msil64-unknown-dotnet that link the managed C library c.dll, the
# freestanding part of LLVM's libc (plan 5.19.4), from the portable sysroot
# that msil/utils/build/build-libc.py installs (plan 5.19.3, 5.18.4 PV2).
#
# The programs are hosted C: they include the sysroot's generated headers and
# get -lc (c.dll) by default, so they compile with %{msil_cflags} minus
# -ffreestanding plus %{msil_portable_libc_cflags} (--sysroot=<the
# msil_portable_sysroot of lit.cfg.py>), and every link of the directory (the
# program and the -shared libraries of %{msil_prog}, and the links a test
# writes itself) reads %{msil_ldflags}, to whose front the same flag goes.
# Every run copies c.dll beside the program: %{msil_deps} is c.dll here, and a
# test that adds files of its own lists %{libc_dll} with them (brief Q22 (a):
# deploying c.dll is the user's job, so the harness does it).
#
# Local substitutions:
#   %{libc_sysroot}  the portable sysroot (forward slashes)
#   %{libc_dll}      <sysroot>/lib/msil64-unknown-dotnet/c.dll
#   %{libc_libdir}   <sysroot>/lib/msil64-unknown-dotnet
#
# Programs have no output channel before P-2: each failed check sets a bit of
# the exit status (plan D37), and every expected file is '[exit 0]',
# hand-written under 5.17.4's portable allowance (see ../lit.local.cfg). The
# expected constants inside the programs come from the C standard, from a
# correctly rounded reference (llvm-libc's math is correctly rounded in this
# configuration) or from llvm-libc's own tables and headers, each named by a
# comment, never from a run (plan 5.19.15).
#
# Without the sysroot (feature msil-portable-sysroot: include/stdio.h, c.dll
# and libm.a) the tests are UNSUPPORTED, except under
# --param msil_require_portable=1, msil_require_link=1 or msil_require_exec=1,
# where that is a configuration error naming build-libc.py.
#
# fnptr-identity.test also links a private C library named c from the
# intermediate archive that build-libc.py links c.dll from and never installs
# (plan 5.19.3, 5.19.8), as 90-loud/lit.local.cfg finds it:
# <build>/runtimes/msil64-unknown-dotnet/libc/lib/libc.a, where <build> is the
# directory whose lib/clang-runtimes/msil64-unknown-dotnet is the sysroot;
# --param msil_portable_libc_archive=PATH names another one. It defines
# %{msil_portable_libc_archive} (the file) and the feature
# msil-portable-libc-archive; a missing archive makes those RUN lines
# UNSUPPORTED (%if), and is a configuration error under the same three
# parameters.
import os
import re

import lit.util


def _libc_flag(name):
    try:
        return lit.util.pythonize_bool(lit_config.params.get(name, "0"))
    except ValueError:
        return False


def _libc_required():
    return (
        _libc_flag("msil_require_portable")
        or getattr(config, "msil_require_link", False)
        or getattr(config, "msil_require_exec", False)
    )


if not config.unsupported:
    _subs = dict(config.substitutions)
    for _key in (
        "%{msil_portable_libc_cflags}",
        "%{msil_cflags}",
        "%{msil_ldflags}",
        "%{msil_deps}",
    ):
        if _key not in _subs:
            lit_config.fatal(
                "msil: msil/test/Portable/01-libc needs lit.cfg.py's %s (plan "
                "5.19.3, P-1b.c), which this configuration does not define" % _key
            )
    if "msil-portable-sysroot" not in config.available_features:
        if _libc_required():
            lit_config.fatal(
                "msil: msil/test/Portable/01-libc cannot run, but the leg "
                "requires it (msil_require_portable=1, msil_require_link=1 or "
                "msil_require_exec=1); missing: the portable sysroot with c.dll "
                "(python msil/utils/build/build-libc.py, or --param "
                "msil_portable_sysroot=DIR)"
            )
        config.unsupported = True

if not config.unsupported:
    _flags = _subs["%{msil_portable_libc_cflags}"]
    _m = re.search(r'--sysroot=(?:"([^"]*)"|(\S+))', _flags)
    if not _m:
        lit_config.fatal(
            "msil: msil/test/Portable/01-libc cannot find --sysroot= in "
            "%%{msil_portable_libc_cflags} (%r)" % _flags
        )
    _sysroot = (_m.group(1) or _m.group(2)).replace("\\", "/").rstrip("/")
    _libdir = _sysroot + "/lib/msil64-unknown-dotnet"
    _dll = _libdir + "/c.dll"

    def _word(path):
        # %{msil_deps} is a list of words on the command line: quote a path
        # with a blank.
        return '"%s"' % path if " " in path else path

    def _hosted(cflags):
        # %{msil_cflags} without -ffreestanding: the programs are hosted C
        # against the sysroot's headers (a separate word, so a path that holds
        # the text stays intact).
        return re.sub(r"(^|\s)-ffreestanding(?=\s|$)", r"\1", cflags).strip()

    _new = []
    for _key, _value in config.substitutions:
        if _key == "%{msil_cflags}":
            _value = _hosted(_value) + " %{msil_portable_libc_cflags}"
        elif _key == "%{msil_ldflags}":
            _value = "%{msil_portable_libc_cflags} " + _value
        elif _key == "%{msil_deps}":
            _value = _word(_dll)
        _new.append((_key, _value))
    _new += [
        ("%{libc_sysroot}", _word(_sysroot)),
        ("%{libc_libdir}", _word(_libdir)),
        ("%{libc_dll}", _word(_dll)),
    ]
    config.substitutions = _new

    # The libc build tree's archive (fnptr-identity.test).
    _archive = lit_config.params.get("msil_portable_libc_archive")
    _origin = "--param msil_portable_libc_archive"
    if not _archive:
        _origin = "the libc build tree of the sysroot's build directory"
        _build = os.path.normpath(os.path.join(_sysroot, "..", "..", ".."))
        _archive = os.path.join(
            _build, "runtimes", "msil64-unknown-dotnet", "libc", "lib", "libc.a"
        )
    if os.path.isfile(_archive):
        _archive = os.path.normpath(os.path.abspath(_archive)).replace("\\", "/")
        config.available_features.add("msil-portable-libc-archive")
        config.substitutions.append(("%{msil_portable_libc_archive}", '"%s"' % _archive))
    elif _libc_required():
        lit_config.fatal(
            "msil: msil/test/Portable/01-libc/fnptr-identity.test needs the libc "
            "build tree's libc.a (%s: %s), but the leg requires every portable "
            "test (msil_require_portable=1, msil_require_link=1 or "
            "msil_require_exec=1); run python msil/utils/build/build-libc.py or "
            "pass --param msil_portable_libc_archive=PATH"
            % (_origin, _archive.replace("\\", "/"))
        )
