# msil/test/Portable/90-loud (P-1b; plan 5.17.4, 5.18.9, 5.19.8, 5.19.16):
# the loud failures of msil64-unknown-dotnet that stay until P-3. Each test
# builds with %{msil_prog_fail_O0} and pins the toolchain's whole text with
# FileCheck: -static (the driver's T-P9; no libc.a in the sysroot), a direct
# link of the libc build tree's libc.a (msil-ld's T-P11), generic and 16-byte
# atomics (N2's portable line), pthread_create and thrd_create (N6 naming
# c.dll) and a native shared object (T-P4; -l never finds a .so). Nothing
# runs, so no test has an expected file. The texts come from P-1a and P-1b
# and stay until P-3, so M27-M35 never re-pin them.
#
# The programs use the managed C library as a user's program does: compiles
# and links read %{msil_portable_libc_cflags} (lit.cfg.py: --sysroot= the
# portable sysroot, feature msil-portable-sysroot), so the link takes c.dll
# through the driver's default -lc. The sysroot is needed; without it the
# directory is UNSUPPORTED, and a configuration error under
# msil_require_portable=1, msil_require_link=1 or msil_require_exec=1.
#
# libc-static.test also needs the intermediate archive that build-libc.py
# links c.dll from and never installs (plan 5.19.3, 5.19.8):
# <build>/runtimes/msil64-unknown-dotnet/libc/lib/libc.a, where <build> is
# the directory whose lib/clang-runtimes/msil64-unknown-dotnet is the
# sysroot. --param msil_portable_libc_archive=PATH names another one. It
# defines %{msil_portable_libc_archive} (the file) and
# %{msil_portable_libc_archive_dir} (its directory), and the feature
# msil-portable-libc-archive; a missing archive is a configuration error
# under the same three parameters.
import os
import re

import lit.util


def _flag(name):
    try:
        return lit.util.pythonize_bool(lit_config.params.get(name, "0"))
    except ValueError:
        return False


def _required():
    return (
        _flag("msil_require_portable")
        or getattr(config, "msil_require_link", False)
        or getattr(config, "msil_require_exec", False)
    )


def _slashes(path):
    return path.replace("\\", "/")


if not config.unsupported:
    _subst = dict(config.substitutions)
    for _key in ("%{msil_portable_libc_cflags}", "%{msil_cflags}", "%{msil_ldflags}"):
        if _key not in _subst:
            lit_config.fatal(
                "msil: msil/test/Portable/90-loud needs lit.cfg.py's %s "
                "(plan 5.18.10, P-1b), which this configuration does not "
                "define" % _key
            )
    if "msil-portable-sysroot" not in config.available_features:
        if _required():
            lit_config.fatal(
                "msil: msil/test/Portable/90-loud cannot run, but the leg "
                "requires it (msil_require_portable=1, msil_require_link=1 or "
                "msil_require_exec=1); missing: the portable sysroot with "
                "c.dll (python msil/utils/build/build-libc.py, or --param "
                "msil_portable_sysroot=DIR)"
            )
        config.unsupported = True

if not config.unsupported:
    # Compiles and links use the sysroot's headers and c.dll.
    config.substitutions = [
        (key, "%{msil_portable_libc_cflags} " + value)
        if key in ("%{msil_cflags}", "%{msil_ldflags}")
        else (key, value)
        for key, value in config.substitutions
    ]

    # The libc build tree's archive (libc-static.test).
    _archive = lit_config.params.get("msil_portable_libc_archive")
    _origin = "--param msil_portable_libc_archive"
    if not _archive:
        _origin = "the libc build tree of the sysroot's build directory"
        _m = re.search(
            r'--sysroot=(?:"([^"]+)"|(\S+))', _subst["%{msil_portable_libc_cflags}"]
        )
        if _m:
            _sysroot = _m.group(1) or _m.group(2)
            _build = os.path.normpath(os.path.join(_sysroot, "..", "..", ".."))
            _archive = os.path.join(
                _build, "runtimes", "msil64-unknown-dotnet", "libc", "lib", "libc.a"
            )
    if _archive and os.path.isfile(_archive):
        _archive = os.path.normpath(os.path.abspath(_archive))
        config.available_features.add("msil-portable-libc-archive")
        config.substitutions.append(
            ("%{msil_portable_libc_archive}", '"%s"' % _slashes(_archive))
        )
        config.substitutions.append(
            (
                "%{msil_portable_libc_archive_dir}",
                '"%s"' % _slashes(os.path.dirname(_archive)),
            )
        )
    elif _required():
        if _archive:
            _where = _slashes(_archive)
        else:
            _where = "no --sysroot= in %{msil_portable_libc_cflags}"
        lit_config.fatal(
            "msil: msil/test/Portable/90-loud/libc-static.test needs the libc "
            "build tree's libc.a (%s: %s), but the leg requires every "
            "portable test (msil_require_portable=1, msil_require_link=1 or "
            "msil_require_exec=1); run python msil/utils/build/build-libc.py "
            "or pass --param msil_portable_libc_archive=PATH" % (_origin, _where)
        )
