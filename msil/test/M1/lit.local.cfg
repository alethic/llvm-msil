# Milestone 1 (Design.md section 12): freestanding C and LLVM IR, compiled for
# an MSIL triple, assembled, verified, force-JITted and run; the imports are
# the Phase-1 imports of plan D14 (puts, putchar and the C math library).
# Needs clang with the MSIL target, ilasm and a .NET runtime, and under the
# obj or lto pipeline also msil-ld and llvm-ar (feature msil-exec);
# otherwise every test here is UNSUPPORTED rather than failing,
# except under --param msil_require_exec=1 (the gate legs of msil/utils/ci),
# where that is a configuration error naming what is missing, so a gate leg
# never passes with every test here UNSUPPORTED.
# Test rules (one RUN line, .expected from update-expected.py, exit statuses
# in 0..255): plan section 5.5 and ../README.md.
if "msil-exec" not in config.available_features:
    if getattr(config, "msil_require_exec", False):
        _needs = [
            ("clang", "clang (LLVM_ENABLE_PROJECTS=clang; build the clang target)"),
            (
                "msil-registered-target",
                "the MSIL target (LLVM_EXPERIMENTAL_TARGETS_TO_BUILD=MSIL)",
            ),
            ("msil-ilasm", "ilasm (--param msil_ilasm=PATH)"),
            ("msil-dotnet", "a .NET runtime for the selected runner"),
        ]
        if "msil-pipeline=asm" not in config.available_features:
            _needs += [
                (
                    "msil-ld",
                    "msil-ld (the obj and lto pipelines link through it; build "
                    "the lld target or pass --param msil_ld=PATH)",
                ),
                (
                    "msil-ar",
                    "llvm-ar (build the llvm-ar target or pass --param msil_ar=PATH)",
                ),
            ]
        lit_config.fatal(
            "msil: msil_require_exec=1, but the execution tests cannot run; "
            "missing: "
            + "; ".join(
                what
                for feature, what in _needs
                if feature not in config.available_features
            )
        )
    config.unsupported = True
