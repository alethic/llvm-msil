# Milestone 2 (Phase 2, plan 5.12.5): programs of several translation units,
# archives and stock-clang bitcode, built by msil/utils/msil-prog.py through
# the clang driver and msil-ld (%{msil_prog}, %{msil_prog_<L>}), verified,
# force-JITted and run against the native transcript, or stopped with a named
# diagnostic (%{msil_prog_fail_<L>}); determinism checks use %{msil_det}.
# Needs the execution harness (feature msil-exec) and msil-ld (feature
# msil-ld); otherwise every test here is UNSUPPORTED rather than failing,
# except under --param msil_require_link=1 (every gate leg of msil/utils/ci),
# where that is a configuration error naming what is missing, so a gate leg
# never passes with every test here UNSUPPORTED. Tests that build archives
# also require msil-ar (the tree's llvm-ar).
# Test format (split-file sources, REDEFINE: placeholders, one %{msil_prog}
# line, .expected from update-expected.py, exit statuses in 0..255): plan
# sections 5.5 and 5.12.5. Checks that depend on how %{msil_prog} builds are
# guarded by %if msil-prog-pipeline=<p>, never by msil-pipeline=<p> (5.12.1).
config.suffixes = [".test"]

_needs = [
    ("msil-exec", "the execution harness (clang with the MSIL target, ilasm and a .NET runtime)"),
    ("msil-ld", "msil-ld (build the lld target; --param msil_ld=PATH)"),
]
_missing = [what for feature, what in _needs if feature not in config.available_features]
if _missing:
    if getattr(config, "msil_require_link", False) or (
        "msil-exec" not in config.available_features
        and getattr(config, "msil_require_exec", False)
    ):
        lit_config.fatal(
            "msil: msil/test/M2 cannot run, but the leg requires it "
            "(msil_require_link=1 or msil_require_exec=1); missing: "
            + "; ".join(_missing)
        )
    config.unsupported = True
