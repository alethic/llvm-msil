# The optional hosted compile-only leg (plan Q16, 5.12.5, 5.12.8; lit-legs
# leg 'hosted'): hosted C through the MSIL triples against a real C library's
# headers and libraries, compiled with -fsyntax-only or linked to ILAsm text
# (-Wl,--lto-emit-asm), never run. The glibc tests need --sysroot with a
# glibc sysroot (feature msil-glibc-sysroot: lit parameter
# msil_glibc_sysroot, $MSIL_GLIBC_SYSROOT, or the default made by
# 'bash msil/utils/make-glibc-sysroot.sh <dir>'), the UCRT tests the Windows
# SDK and Visual C++ headers of INCLUDE (feature msil-ucrt-headers); the
# tests that link also need msil-ld. Nothing here runs a program, so unlike
# the rest of msil/test/M2 these tests do not need the execution harness
# (ilasm and a .NET runtime): only clang with the MSIL target.
config.suffixes = [".test"]
config.unsupported = not (
    {"clang", "msil-registered-target"} <= config.available_features
)
