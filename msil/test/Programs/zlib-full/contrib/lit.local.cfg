# zlib 1.3.2's contrib/puff and contrib/blast as hosted programs (plan
# 5.17.15; M27): the two small decoders that report running out of input
# with longjmp, built from the zlib tree of the corpus cache (the manifest's
# zlib entry, which zlib-full uses too) with a driver of this directory each,
# against the real C library headers of the triple, and compared with the
# hosted native build of the same sources.
#   puff.test   puff() (deflate) on the streams of contrib/puff/Makefile's
#               'cov' target, its zeros.raw (copied from the cache next to
#               the program through %{msil_run_opts}, named by
#               %{msil_run_args}) and streams that puff_main.c builds, with
#               every prefix of those that run out of input
#   blast.test  blast() (PKWare DCL) on blast.c's header example, whole, in
#               1-byte chunks and truncated, and on streams blast_main.c
#               builds
# setjmp and longjmp are M27's (MSILLowerSjLj; plan 5.15.4): each library's
# setjmp caller gets its wrapped calls, and its longjmp the module's
# __msil_longjmp. The tests need the corpus cache (REQUIRES: msil-corpus-zlib;
# ../../lit.local.cfg has the rest of the corpus rules). The parent directory
# is hosted already and lit inherits its configuration; the line below states
# it here as well (plan 5.17.3): %{msil_cflags} without -ffreestanding and
# with the triple's headers (%{msil_hosted_cflags}), the hosted native oracle
# (%{msil_oracle_flags} = --hosted: E7h on Linux triples, the DLL C runtime on
# Windows triples), and UNSUPPORTED without the feature msil-hosted (a
# configuration error under msil_require_hosted=1). update-expected.py reads
# the same line.
config.msil_enable_hosted(config)
