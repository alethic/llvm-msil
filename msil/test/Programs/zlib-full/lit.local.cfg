# zlib 1.3.2 in full, as a hosted program (plan 5.17.15; M26): the 15
# library files (gzip file I/O, compress and uncompress included) in libz.a,
# with zlib's own test programs test/example.c and test/minigzip.c, built
# against the real C library headers of the triple instead of ../shim and
# ../support, and linked against the host C library (glibc on Linux triples,
# the UCRT on Windows triples). gzprintf, example's printf and the glibc
# fortify wrappers are variadic, so the directory needs M26's variadics.
#   example.test   %{msil_prog}: example's transcript against the native one
#   fortify.test   (Linux triples) the same with -D_FORTIFY_SOURCE=2 at -O2
#   minigzip.test  minigzip on a generated 2 MiB input (minigzip-data.py), the
#                  gzip stream compared byte for byte with the native one and
#                  'minigzip -d' of the native stream compared with the input,
#                  on every runtime of the leg (see %{minigzip_also_run_<L>})
# ../det/zlib-full.test builds example.test's program twice for %{msil_det}.
# The tests need the corpus cache (REQUIRES: msil-corpus-zlib; ../lit.local.cfg
# has the rest of the corpus rules). The line below makes the directory
# hosted (plan 5.17.3): %{msil_cflags} without -ffreestanding and with the
# triple's headers (%{msil_hosted_cflags}), the hosted native oracle
# (%{msil_oracle_flags} = --hosted: E7h on Linux triples, the DLL C runtime on
# Windows triples), and UNSUPPORTED without the feature msil-hosted (a
# configuration error under msil_require_hosted=1). update-expected.py reads
# the same line.
config.msil_enable_hosted(config)

# minigzip.test under msil_also_run (lit.cfg.py's "more runtimes"; plan
# 5.12.2, 5.12.3): %{msil_also_run_check} runs an image with no arguments
# and checks its transcript, which does not fit minigzip (its streams are
# files and never pass through a transcript), so this directory builds
# minigzip's runs from the entries' commands that lit.cfg.py builds that
# expansion from: config.msil_also_run_cmds, a list of (tag, jitall command,
# exec command) per entry, in the parameter's order, with the tag
# also-net<major>[-tc0] of its transcript (each command carries the entry's
# runtimeconfig.json and, for +tc0, --env "DOTNET_TieredCompilation=0" after
# the leg's msil_dotnet_env). Per entry:
#   %{minigzip_also_tags}    the tags, comma-separated ('' without
#                            msil_also_run), for 'minigzip-data.py setup
#                            --also', which makes the run directories
#                            <L>/<tag> and <L>/<tag>-d and their argument files
#   %{minigzip_also_run_<L>} for each level L, jitall of %t.<L>.d/prog.exe
#                            (under %if msil-jitall) and the compress and -d
#                            runs of the image on the entry's runtime, each
#                            QUIET, then the same SAME and INPUTSIZE
#                            comparisons as the .NET Framework runs; the
#                            entries joined with ' && ' ('' without
#                            msil_also_run)
# A lit.cfg.py without config.msil_also_run_cmds, or entries that disagree
# with the feature msil-also-run, is a configuration error here, so the runs
# cannot silently drop out.

_MINIGZIP_LEVELS = ("O0", "O1", "O2", "O3", "Os", "Oz")
# The expansions hold the interpreter itself, not %python: they expand after
# %python's own entry, and lit's %p would then take the '%p' of '%python'.
_minigzip_python = next((b for a, b in config.substitutions if a == "%python"), None)
if _minigzip_python is None:
    lit_config.fatal("msil: zlib-full/lit.local.cfg: lit.cfg.py defines no %python")
_also_entries = getattr(config, "msil_also_run_cmds", None)  # [(tag, jit, run)]
if _also_entries is None:
    lit_config.fatal(
        "msil: zlib-full/lit.local.cfg: msil/test/lit.cfg.py defines no "
        "config.msil_also_run_cmds (the msil_also_run entries' (tag, jitall "
        "command, exec command), which minigzip.test's runs are built from)"
    )
_also_entries = list(_also_entries)
if bool(_also_entries) != ("msil-also-run" in config.available_features):
    lit_config.fatal(
        "msil: zlib-full/lit.local.cfg: %d msil_also_run entries but the feature "
        "msil-also-run is %s"
        % (
            len(_also_entries),
            "set" if "msil-also-run" in config.available_features else "unset",
        )
    )


def _minigzip_also_run(level, tag, jit, run):
    image = "%%t.%s.d/prog.exe" % level
    d = "%%t/%s/%s" % (level, tag)
    stream = (
        "%%if msil-native-oracle %%{ cp %%t/%s/native/data.gz %s-d/data.gz %%}"
        " %%else %%{ cp %%t/%s/msil/data.gz %s-d/data.gz %%}" % (level, d, level, d)
    )
    return " && ".join(
        [
            "%%if msil-jitall %%{ %s %s && %%} %s -- %s %%{readfile:%s.arg}"
            " | FileCheck %%s --check-prefix=QUIET" % (jit, image, run, image, d),
            "%s %%S/minigzip-data.py cmp %%t/%s/msil/data.gz %s/data.gz"
            " | FileCheck %%s --check-prefix=SAME" % (_minigzip_python, level, d),
            stream,
            "%s -- %s -d %%{readfile:%s-d.arg} | FileCheck %%s --check-prefix=QUIET"
            % (run, image, d),
            "%s %%S/minigzip-data.py cmp %%t/input %s-d/data"
            " | FileCheck %%s --check-prefix=INPUTSIZE" % (_minigzip_python, d),
        ]
    )


config.substitutions.append(
    ("%{minigzip_also_tags}", ",".join(tag for tag, _, _ in _also_entries))
)
for _level in _MINIGZIP_LEVELS:
    config.substitutions.append(
        (
            "%%{minigzip_also_run_%s}" % _level,
            " && ".join(_minigzip_also_run(_level, *e) for e in _also_entries),
        )
    )
