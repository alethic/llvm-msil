# Lua 5.4.9 as a hosted program (plan 5.17.15; M27): the 32 core and library
# files of the corpus cache's lua-5.4.9/src in liblua.a, built against the
# real C library headers of the triple with -DLUA_COMPAT_5_3 and the
# forced-include msil_lua_config.h (LUA_USE_LINUX on Linux triples, as Lua's
# 'make linux'; luaconf.h picks LUA_USE_WINDOWS on Windows triples), and
# linked against the host C library. Every Lua error and every coroutine
# yield is a longjmp (ldo.c's LUAI_THROW: _longjmp on Linux triples, longjmp
# on Windows triples) to the setjmp of luaD_rawrunprotected, so the
# directory needs M27's setjmp and longjmp, and M26's variadics (lua_pushfstring,
# luaL_error, the printf family).
#   lua-embed.test  %{msil_prog}: the embedding driver lua_embed.c runs
#                   prog1.lua and prog2.lua (toolchain-authored, from the
#                   hosted-libc recon's data) in fresh states, and chunks of
#                   its own through the C API; transcript against native
#   lua-suite.test  Lua's own lua.c with lua_nosignal.c (signal and
#                   sigaction as no-ops until M28's callbacks) runs Lua's
#                   test suite (the corpus cache's lua-tests-5.4.9, all.lua
#                   with -e_U=true) from a copy of the tree, on every runtime
#                   of the leg; FileCheck of 'final OK !!!' and [exit 0]
# ../det/lua.test builds lua-embed.test's program twice for %{msil_det}.
# The tests need the corpus cache (REQUIRES: msil-corpus-lua, and
# msil-corpus-lua-tests for the suite; ../lit.local.cfg has the rest of the
# corpus rules). The line below makes the directory hosted (plan 5.17.3):
# %{msil_cflags} without -ffreestanding and with the triple's headers
# (%{msil_hosted_cflags}), the hosted native oracle (%{msil_oracle_flags} =
# --hosted: E7h on Linux triples, the DLL C runtime on Windows triples), and
# UNSUPPORTED without the feature msil-hosted (a configuration error under
# msil_require_hosted=1). update-expected.py reads the same line.
config.msil_enable_hosted(config)

# lua-suite.test has explicit RUN lines (its runs take the test tree and
# arguments, and FileCheck, not a transcript, checks them) and builds once
# per level of the leg, as the composites do. Its RUN lines name every level;
# the feature lua-level=<L> tells it which ones the leg runs: one per entry
# of config.msil_opt_levels, which msil/test/lit.cfg.py sets from --param
# msil_opt_levels after checking it (plan section 12's row 'M27.h's
# `lua-suite.test` as built ...').
for _level in config.msil_opt_levels:
    config.available_features.add("lua-level=" + _level)
