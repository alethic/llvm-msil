# The Phase 2 exit corpus (plan 5.12.9; M23): nine multi-TU C programs (zlib,
# tinf with zlib, Monocypher, CoreMark, LZ4, BLAKE2, TweetNaCl, KISS FFT,
# jsmn), each built with static archives from the sources that
# msil/utils/corpus/fetch.py downloads into a cache outside the repository
# (never vendored), by %{msil_prog} against the native build of the same
# sources, and by %{msil_det} twice (det/); and c-testsuite's libc-free tests
# (c-testsuite/, its own test format).
# Layout: support/ is the support library (an arena allocator, the C library
# functions a freestanding MSIL build lacks, output through puts), shim/ the
# headers both builds use instead of the C library's, and each program
# directory its driver(s) and <name>.test, whose REDEFINE: lines name the
# sources (%{msil_srcs}), the archives (%{msil_archives}, with the cache as
# %{msil_corpus}) and the flags (%{msil_copts}); .expected files come from
# msil/utils/update-expected.py --corpus-dir.
# Only .test files are tests: the drivers, support files and shims are not.
# Every test needs the cache: without the feature msil-corpus (lit.cfg.py:
# the stamp msil-corpus.stamp matches msil/utils/corpus/manifest.json; under
# msil_require_corpus=1 a missing or stale stamp is already fatal there)
# everything here is UNSUPPORTED, and each test REQUIRES msil-corpus-<name>
# for the trees it builds from, so an entry the stamp leaves out on purpose
# (msil_corpus_skip; CoreMark and c-testsuite in CI, plan 5.12.12) is
# UNSUPPORTED with no change here. Like msil/test/M2, the programs need the
# execution harness (clang with the MSIL target, ilasm and a .NET runtime),
# msil-ld and the tree's llvm-ar; a missing one makes everything here
# UNSUPPORTED, except under msil_require_link=1 (every gate leg; also
# msil_require_exec=1 when lit.cfg.py leaves msil-exec unset, which under the
# obj and lto pipelines also happens without msil-ld or llvm-ar), where it is
# a configuration error naming each missing part by its feature.
config.suffixes = [".test"]

_needs = [
    ("clang", "clang (LLVM_ENABLE_PROJECTS=clang; build the clang target)"),
    ("msil-registered-target", "the MSIL target (LLVM_EXPERIMENTAL_TARGETS_TO_BUILD=MSIL)"),
    ("msil-ilasm", "ilasm (--param msil_ilasm=PATH)"),
    ("msil-dotnet", "a .NET runtime for the selected runner"),
    ("msil-ld", "msil-ld (build the lld target; --param msil_ld=PATH)"),
    ("msil-ar", "the tree's llvm-ar (build llvm-ar; --param msil_ar=PATH)"),
]
_missing = [what for feature, what in _needs if feature not in config.available_features]
if not _missing and "msil-exec" not in config.available_features:
    # A part of msil-exec that the list above does not know.
    _missing = ["the execution harness (lit.cfg.py's feature msil-exec)"]
if _missing:
    if getattr(config, "msil_require_link", False) or (
        "msil-exec" not in config.available_features
        and getattr(config, "msil_require_exec", False)
    ):
        lit_config.fatal(
            "msil: msil/test/Programs cannot run, but the leg requires it "
            "(msil_require_link=1 or msil_require_exec=1); missing: "
            + "; ".join(_missing)
        )
    config.unsupported = True
elif "msil-corpus" not in config.available_features:
    config.unsupported = True
