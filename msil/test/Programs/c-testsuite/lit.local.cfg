# c-testsuite's libc-free tests through the leg's pipeline (plan 5.12.9; M23;
# c-testsuite runs through objects, the default pipeline): libc-free.txt lists
# the tests of the cached tree's tests/single-exec that call no C library
# function, and msil_ctest_format.py yields one lit test per listed name,
# 'MSIL :: Programs/c-testsuite/<name>', whose script is ctest.template: lit
# runs it as the test's own file, so %{msil_prog} builds
# %{msil_corpus}/<tree>/tests/single-exec/<name>.c with %{msil_cflags}
# redefined to -std=gnu17 -w (the recon's flags, in the MSIL and the native
# oracle build alike; no -ffreestanding, because several tests rely on main's
# implicit 'return 0') and compares with exit0.expected through
# %{msil_expect}; a '<name> diag <text>' entry instead expects the named
# diagnostic of a Phase 3 feature from %{msil_prog_fail_<L>} at each level.
# Without the corpus (feature msil-corpus-c-testsuite: the stamp lists the
# tree; CI leaves c-testsuite out through msil_corpus_skip) every test is
# UNSUPPORTED. With it, this file checks the list against the cached tree:
# the names must be exactly the tests that libc-free.txt's '# rule:' matches
# nowhere, and each must have an empty <name>.c.expected; anything else is a
# configuration error, as is a malformed libc-free.txt.
import os
import sys

_dir = os.path.dirname(os.path.abspath(__file__))
_tree = "c-testsuite-5c7275656d75"

# lit pickles each test, its configuration and so this format for its worker
# processes, which import the format's module by name: it must be importable
# from a directory on sys.path, which the workers inherit. No bytecode is
# written next to it (the workers inherit the environment variable).
if _dir not in sys.path:
    sys.path.append(_dir)
os.environ["PYTHONDONTWRITEBYTECODE"] = "1"
_dont_write = sys.dont_write_bytecode
sys.dont_write_bytecode = True
try:
    import msil_ctest_format
finally:
    sys.dont_write_bytecode = _dont_write

try:
    _list = msil_ctest_format.TestList(os.path.join(_dir, "libc-free.txt"))
except (OSError, msil_ctest_format.ListError) as e:
    lit_config.fatal("msil: %s" % e)

# The levels of %{msil_prog} (lit.cfg.py's msil_opt_levels), for the diag
# entries' %{msil_prog_fail_<L>}.
_levels = [
    o.strip()
    for o in lit_config.params.get("msil_opt_levels", "O0,O2").split(",")
    if o.strip()
]

if (
    not config.unsupported
    and "msil-corpus-c-testsuite" in config.available_features
):
    _subs = dict(config.substitutions)
    _needed = ["%{msil_corpus}", "%{msil_srcs}", "%{msil_cflags}", "%{msil_expect}"]
    _needed += ["%%{msil_prog_fail_%s}" % o for o in _levels]
    _lacks = [n for n in _needed if n not in _subs]
    if _lacks:
        lit_config.fatal(
            "msil: msil/test/Programs/c-testsuite needs the substitutions "
            + ", ".join(_lacks)
            + ", which lit.cfg.py does not define"
        )
    _tests = os.path.join(_subs["%{msil_corpus}"], _tree, "tests", "single-exec")
    try:
        _free = msil_ctest_format.libc_free(_list.rule, _tests)
    except OSError as e:
        lit_config.fatal("msil: c-testsuite: cannot read the cached tree: %s" % e)
    _listed = _list.names()
    _extra = sorted(set(_listed) - set(_free))
    _absent = sorted(set(_free) - set(_listed))
    if _extra or _absent:
        lit_config.fatal(
            "msil: libc-free.txt does not match %s by its rule: listed but not "
            "libc-free or not in the tree: %s; libc-free but not listed: %s"
            % (_tests, ", ".join(_extra) or "none", ", ".join(_absent) or "none")
        )
    for _name in _listed:
        _expected = os.path.join(_tests, _name + ".c.expected")
        if not os.path.isfile(_expected) or os.path.getsize(_expected):
            lit_config.fatal(
                "msil: c-testsuite test %s is listed in libc-free.txt, but %s is "
                "missing or not empty (every listed test must print nothing and "
                "exit 0, exit0.expected)" % (_name, _expected)
            )

config.test_format = msil_ctest_format.CTestSuiteFormat(
    _list.entries, _tree, _levels, "-std=gnu17 -w"
)
