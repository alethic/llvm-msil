# c-testsuite's tests through the leg's pipeline (plan 5.12.9, 5.17.14;
# c-testsuite runs through objects, the default pipeline): libc-free.txt
# lists the tests of the cached tree's tests/single-exec that call no C
# library function, and libc.txt (required from M26) the others.
# msil_ctest_format.py reads both with one grammar and yields one lit test
# per entry, 'MSIL :: Programs/c-testsuite/<name>' for libc-free.txt and
# 'MSIL :: Programs/c-testsuite/libc/<name>' for libc.txt, whose script is
# ctest.template: lit runs it as the test's own file, so %{msil_prog} builds
# %{msil_corpus}/<tree>/tests/single-exec/<name>.c with %{msil_cflags}
# redefined to -std=gnu17 -w (the recon's flags, in the MSIL and the native
# oracle build alike; no -ffreestanding, because several tests rely on main's
# implicit 'return 0'), with %{msil_hosted_cflags} after them for libc.txt,
# and compares with %t/<name>.expected, which the format writes from
# <name>.c.expected and '[exit 0]'. A 'native <triple>' entry compares with
# the native oracle's transcript on that triple instead, a 'diag' entry
# expects a named diagnostic from %{msil_prog_fail_<L>} at each level, and
# an 'exclude <triple>' entry is UNSUPPORTED on that triple with its reason.
# libc.txt's tests run under a copy of this configuration that lit.cfg.py's
# config.msil_enable_hosted makes hosted (plan 5.17.3): UNSUPPORTED without
# msil-hosted (fatal under msil_require_hosted=1, unless the directory is
# UNSUPPORTED anyway), %{msil_oracle_flags} --hosted; a lit.cfg.py without
# that function is a configuration error, and so is a missing libc.txt. Without the corpus (feature
# msil-corpus-c-testsuite: the stamp lists the tree; a local MSIL_CORPUS_SKIP
# may leave c-testsuite out through msil_corpus_skip; CI does not since M24)
# every test is UNSUPPORTED. With it, this file checks both lists against the
# cached tree: libc-free.txt's names must be exactly the tests that its
# '# rule:' matches nowhere, libc.txt's (under the same rule) exactly the
# others, and each listed test must have its
# <name>.c.expected; anything else is a configuration error, as is a
# malformed list.
import copy
import os
import sys

_dir = os.path.dirname(os.path.abspath(__file__))
_tree = "c-testsuite-5c7275656d75"

# lit pickles each test, its configuration and so this format for its worker
# processes, which import the format's module by name: it must be importable
# from a directory on sys.path, which the workers inherit. No bytecode is
# written next to it (the workers inherit the environment variable).
if _dir not in sys.path:
    sys.path.append(_dir)
os.environ["PYTHONDONTWRITEBYTECODE"] = "1"
_dont_write = sys.dont_write_bytecode
sys.dont_write_bytecode = True
try:
    import msil_ctest_format
finally:
    sys.dont_write_bytecode = _dont_write

# libc.txt is required from M26 (plan 5.17.14): without it the hosted
# tests would silently go missing.
_libc_path = os.path.join(_dir, "libc.txt")
if not os.path.isfile(_libc_path):
    lit_config.fatal(
        "msil: c-testsuite: libc.txt does not exist: %s (required from M26, "
        "plan 5.17.14: it lists the tests that libc-free.txt's rule matches)" % _libc_path
    )
try:
    _list = msil_ctest_format.TestList(os.path.join(_dir, "libc-free.txt"))
    _libc = msil_ctest_format.TestList(_libc_path)
    if _libc.rule_text != _list.rule_text:
        raise msil_ctest_format.ListError(
            "%s: the '# rule:' line differs from libc-free.txt's (both lists "
            "split the tree by one rule)" % _libc_path
        )
except (OSError, msil_ctest_format.ListError) as e:
    lit_config.fatal("msil: %s" % e)

# The levels of %{msil_prog} (lit.cfg.py's msil_opt_levels), for the diag
# entries' %{msil_prog_fail_<L>}; the native entries' oracle builds at the
# first.
_levels = [
    o.strip()
    for o in lit_config.params.get("msil_opt_levels", "O0,O2").split(",")
    if o.strip()
]
# The native program of a 'native' entry: an ELF of the E7 Linux oracles
# under msil_runner=wsl, else an EXE (as %{msil_prog}'s native leg).
_native_ext = "elf" if lit_config.params.get("msil_runner", "local") == "wsl" else "exe"

_tests = None
if (
    not config.unsupported
    and "msil-corpus-c-testsuite" in config.available_features
):
    _subs = dict(config.substitutions)
    _needed = ["%{msil_corpus}", "%{msil_srcs}", "%{msil_cflags}", "%{msil_expect}"]
    _needed += ["%%{msil_prog_fail_%s}" % o for o in _levels]
    _lacks = [n for n in _needed if n not in _subs]
    if _lacks:
        lit_config.fatal(
            "msil: msil/test/Programs/c-testsuite needs the substitutions "
            + ", ".join(_lacks)
            + ", which lit.cfg.py does not define"
        )
    _tests = os.path.join(_subs["%{msil_corpus}"], _tree, "tests", "single-exec")
    try:
        _free, _matched = msil_ctest_format.split_tree(_list.rule, _tests)
    except OSError as e:
        lit_config.fatal("msil: c-testsuite: cannot read the cached tree: %s" % e)
    _listed = _list.names()
    _extra = sorted(set(_listed) - set(_free))
    _absent = sorted(set(_free) - set(_listed))
    if _extra or _absent:
        lit_config.fatal(
            "msil: libc-free.txt does not match %s by its rule: listed but not "
            "libc-free or not in the tree: %s; libc-free but not listed: %s"
            % (_tests, ", ".join(_extra) or "none", ", ".join(_absent) or "none")
        )
    _listed_libc = _libc.names()
    _extra = sorted(set(_listed_libc) - set(_matched))
    _absent = sorted(set(_matched) - set(_listed_libc))
    if _extra or _absent:
        lit_config.fatal(
            "msil: libc.txt does not match %s by its rule: listed but not "
            "matched by the rule or not in the tree: %s; matched by the rule "
            "but not listed: %s"
            % (_tests, ", ".join(_extra) or "none", ", ".join(_absent) or "none")
        )
    _listed = _listed + _listed_libc
    for _name in _listed:
        _expected = os.path.join(_tests, _name + ".c.expected")
        if not os.path.isfile(_expected):
            lit_config.fatal(
                "msil: c-testsuite test %s is listed, but %s does not exist (the "
                "format writes the test's expected file from it)" % (_name, _expected)
            )

# On windows-msvc native triples the native link of this directory's tests
# also takes legacy_stdio_definitions.lib: libc/00210, 00211, 00213, 00215,
# 00217 and 00218 declare printf themselves, without <stdio.h>, and UCRT's
# printf is only an inline function of <stdio.h>, so the native oracle needs
# that library's out-of-line one (as M3/05-variadics/ucrt-noinc gets it
# through '#pragma comment(lib, ...)'). The MSIL link takes the helper
# archive's member instead; msil-prog.py passes %{msil_native_ldflags} to the
# native link only. The option is written as lit.cfg.py writes the builtins,
# '-l<name>.lib', one option word that the MSVC driver passes to the linker
# unchanged. The test is lit.cfg.py's msvc_native, on the leg's triple.
_msil_triple = next(
    (
        f[len("msil-triple="):]
        for f in config.available_features
        if f.startswith("msil-triple=")
    ),
    "",
)
_native_parts = _msil_triple[: -len("-msil")].split("-") if _msil_triple else []
if (
    "windows" in _native_parts
    and (_native_parts[3] if len(_native_parts) > 3 else "msvc").startswith("msvc")
):
    _legacy_stdio = "-llegacy_stdio_definitions.lib"
    for _i, (_key, _value) in enumerate(config.substitutions):
        if _key == "%{msil_native_ldflags}":
            _value = (_value + " " + _legacy_stdio).strip()
            config.substitutions[_i] = (_key, _value)
            break
    else:
        lit_config.fatal(
            "msil: msil/test/Programs/c-testsuite needs the substitution "
            "%{msil_native_ldflags}, which lit.cfg.py does not define"
        )

_format = msil_ctest_format.CTestSuiteFormat(
    _list.entries, _tree, _levels, "-std=gnu17 -w", tests_dir=_tests, native_ext=_native_ext
)
# The hosted settings of libc.txt's tests (plan 5.17.3, 5.17.14), on a
# copy of this configuration, as lit copies a parent's configuration for
# a directory with its own lit.local.cfg; the tests are its, and so is
# this format. A directory that is UNSUPPORTED already (no corpus, no
# execution harness) stays so without hosted mode's requirements.
_enable = getattr(config, "msil_enable_hosted", None)
if not callable(_enable):
    lit_config.fatal(
        "msil: c-testsuite's libc.txt needs hosted mode "
        "(config.msil_enable_hosted, plan 5.17.3), which lit.cfg.py does not define"
    )
_hosted = copy.deepcopy(config)
if not _hosted.unsupported:
    _enable(_hosted)
_hosted.test_format = _format
_hosted_subs = dict(_hosted.substitutions)
_lacks = [
    n for n in ("%{msil_hosted_cflags}", "%{msil_oracle_flags}") if n not in _hosted_subs
]
if _lacks:
    lit_config.fatal(
        "msil: c-testsuite's libc.txt needs the substitutions "
        + ", ".join(_lacks)
        + ", which lit.cfg.py does not define"
    )
_format.add_libc(_libc.entries, "-std=gnu17 -w %{msil_hosted_cflags}", _hosted)
config.test_format = _format
