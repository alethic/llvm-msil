# CI for the MSIL fork (llvm/docs/MSIL/Design.md, llvm/docs/MSIL/ImplementationPlan.md).
#
# Only workflows named msil-*.yml are meant to run in this repository. The
# workflows inherited from llvm/llvm-project are never edited or deleted (that
# would conflict on every upstream merge); the repository owner disables them
# in the repository settings with .github/msil/disable-upstream-workflows.sh.
#
# Each job sets up its tools; then makes the exit corpus' cache directory
# outside the checkout, restores the cache (actions/cache) and fetches and
# verifies the corpus with msil/utils/corpus/fetch.py (each fetch.py run with
# --skip of MSIL_CORPUS_SKIP); then runs the scripts in msil/utils/ci in this
# order: configure, build, unit-tests and lit-legs; then det-manifest.py build
# and the upload of its manifest; and in the Windows job upstream-hooks. The
# determinism job, which needs both jobs, runs det-manifest.py compare on the
# two manifests. The local phase gate (msil/utils/run-m1-gate.ps1, plan M10,
# M11 and M23) runs the Windows job's scripts in the same order on the
# development host, so the gate executes the CI commands. It differs in
# host-setup, which only the development host needs, and in the corpus and
# determinism rows, which the CI runs as its own steps and job: the gate never
# skips a corpus entry (fetch.py --check of all ten; MSIL_CORPUS_SKIP is
# removed from the legs' environment), and it runs det-manifest.py build twice
# on the one host before compare. configure differs too (CI uses
# msil/cmake/caches/MSIL.cmake, the host msil/utils/build/msil-configure.ps1),
# and the gate also runs the upstream-hooks legs that CI skips. The Linux
# job's scripts need a Linux build tree, so the gate only smoke-checks them
# inside WSL (its ci-sh row: bash -n, the leg list of lit-legs.sh, and their
# failure exit status against an empty build directory). The scripts build
# the targets of msil/utils/ci/build-targets.txt, the one build-target list
# of the gates and both jobs (clang, llc, lld with msil-ld, llvm-ar and its
# copies, the binary tools and the unit tests; projects clang and lld, the
# X86 and experimental MSIL targets), run the MSIL unit tests (CLITests among
# them) and then the test legs of the Phase 2 exit (plan 5.12.11, M23): the
# llc/clang FileCheck tests and the execution tests in msil/test, compiled to
# CIL objects and linked by msil-ld (the default pipeline from M23), verified
# (ILVerify, jitall, and PEVerify on Windows), run on .NET and compared with
# checked-in transcripts and a native build (the native oracle); -S plus
# ilasm stays as the asm oracle. One verified build serves several runtimes
# (msil_also_run).
#   linux:   x86_64-unknown-linux-gnu-msil; net8 (.NET 8, and .NET 10, .NET 8
#            and .NET 10 with DOTNET_TieredCompilation=0 through
#            msil_also_run), more-levels (O1, O3, Os, Oz), asm-oracle (NuGet
#            ilasm and ildasm, the ildasm -> ilasm round trip), lto, det,
#            the reference legs (msil-ld binding the BCL against the .NET
#            Framework 4.8 reference assemblies of the NuGet package that
#            msil-tools.proj pins, exported as MSIL_REF_NET48, and against
#            the .NET 8 and 10 targeting packs), roundtrip (O2 on msil-ld's
#            outputs), the exit corpus (programs, programs-lto, ctest),
#            .expected files vs native, the update_llc_test_checks tests (utc)
#   windows: x86_64-pc-windows-msvc-msil; net8 (.NET 8 and .NET Framework 4.8,
#            .NET 10 and .NET 8 with DOTNET_TieredCompilation=0 through
#            msil_also_run, the equivalence oracles O3 and O6), more-levels,
#            asm-oracle (Framework ilasm, ildasm and PEVerify), modern-ilasm,
#            roundtrip, expected, utc, obj-text, lto, det, the reference legs,
#            the exit corpus (programs, programs-lto, ctest); then the
#            upstream hook tests (msil/utils/ci/upstream-hooks.ps1 -NoCompile
#            -NoManifest: action pins, the upstream lit tests of the upstream
#            files the fork changes, full TargetParserTests and MCTests)
# The exit corpus (plan 5.12.9) is never part of the repository: each job
# caches it outside the checkout (actions/cache, keyed on
# msil/utils/corpus/manifest.json) and fills and verifies the cache with
# msil/utils/corpus/fetch.py, leaving out the entries of MSIL_CORPUS_SKIP
# below (CoreMark and c-testsuite, whose CI licences are unverified), whose
# tests are UNSUPPORTED and whose ctest leg is a SKIP row; the phase gate on
# the development host (run-m1-gate.ps1) runs all ten. After the legs each job
# writes a manifest of the CIL objects and archives it builds from
# msil/test/M1 (msil/utils/ci/det-manifest.py, both x86_64 MSIL triples, -O0
# and -O2), and the determinism job compares the two (plan 5.12.12): no PE is
# compared across hosts, the det legs check PE determinism within each host.
# The legs that need WSL (the Linux triple and the Linux ilasm run from
# Windows) run only on the development host (lit-legs.ps1 -Wsl). Nightly and
# manual 'full' runs add every optimization level, and on Linux check-llvm and
# check-clang. Every lit leg passes msil_require_verify=1 (plan decision D38),
# msil_require_exec=1 and msil_require_link=1, and the corpus legs also
# msil_require_corpus=1, so a missing verifier, jitall, compiler, runtime,
# msil-ld or llvm-ar, or a corpus cache that fetch.py did not verify, fails
# the job instead of silently skipping a step.
name: MSIL CI

permissions:
  contents: read

on:
  # Manual runs only (plan section 10, item 5). The push, pull_request and
  # nightly triggers below are enabled by the repository owner, after making an
  # msil-* branch the default branch (GitHub runs schedules from the default
  # branch only) and running .github/msil/disable-upstream-workflows.sh, so
  # that pushes to this fork do not start the inherited upstream workflows.
  #
  # push:
  #   branches:
  #     - 'msil'
  #     - 'msil-milestone*'
  # pull_request:
  #   branches:
  #     - 'msil-*'
  #   paths-ignore:
  #     - 'llvm/docs/**'
  # schedule:
  #   - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run every optimization level (and on Linux check-llvm and check-clang; adds hours)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  FULL_CHECK: ${{ github.event_name == 'schedule' || inputs.full == true }}
  # The pinned IL tool versions (MsilILAsmVersion, MsilILVerifyVersion) are
  # set only in this project file; the steps below and msil/utils/ci read them
  # from it. (The gtest filter of the unit tests lives in
  # msil/utils/ci/unit-tests.{sh,ps1}.)
  MSIL_TOOLS_PROJ: msil/utils/tools/msil-tools.proj
  # The exit-corpus entries that CI neither downloads nor runs (plan 5.12.12,
  # section 12 row 'M23 CI corpus'): the CI licences of CoreMark (EEMBC licence
  # agreement) and c-testsuite (per-test licences from scc and tinycc) are
  # unverified until the user answers plan section 10 item 11 ('CI licences of
  # the exit corpus'). fetch.py gets it as --skip, lit-legs as
  # msil_corpus_skip; if the user allows CI to fetch them, a section 12 row
  # empties it.
  MSIL_CORPUS_SKIP: coremark,c-testsuite

jobs:
  linux:
    name: Linux x86_64 (.NET 8 and 10)
    if: github.repository_owner == 'alethic'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang lld

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages and dotnet tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA upstream pins for actions/cache/restore and actions/cache/save)
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/tools
          key: msil-dotnet-tools-${{ runner.os }}-${{ hashFiles('msil/utils/tools/msil-tools.proj') }}

      - name: Fetch ilasm and ildasm (NuGet) and ILVerify (dotnet tool)
        run: |
          ilasm_version=$(dotnet msbuild "$MSIL_TOOLS_PROJ" -getProperty:MsilILAsmVersion | tr -d '\r')
          ilverify_version=$(dotnet msbuild "$MSIL_TOOLS_PROJ" -getProperty:MsilILVerifyVersion | tr -d '\r')
          for v in "$ilasm_version" "$ilverify_version"; do
            if [[ ! $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::cannot read the tool versions from $MSIL_TOOLS_PROJ (got '$v')"
              exit 1
            fi
          done

          dotnet restore "$MSIL_TOOLS_PROJ" -p:MsilToolsRid=linux-x64
          native=runtimes/linux-x64/native
          packages=${NUGET_PACKAGES:-$HOME/.nuget/packages}
          ilasm=$packages/runtime.linux-x64.microsoft.netcore.ilasm/$ilasm_version/$native/ilasm
          ildasm=$packages/runtime.linux-x64.microsoft.netcore.ildasm/$ilasm_version/$native/ildasm
          # NuGet extraction does not keep the executable bit.
          chmod +x "$ilasm" "$ildasm"
          # Fail here, not after the build, if this ilasm cannot assemble (flags as in %ilasm).
          printf '%s\n' '.assembly extern mscorlib {}' '.assembly smoke {}' > "$RUNNER_TEMP/smoke.il"
          "$ilasm" -nologo -quiet -dll -pe64 -x64 -output="$RUNNER_TEMP/smoke.dll" "$RUNNER_TEMP/smoke.il"
          # Likewise for ildasm: msil-verify.py round-trips every DLL through
          # ildasm and ilasm, and lit.cfg.py takes it from $MSIL_ILDASM (the
          # roundtrip leg finds both in the NuGet folder, at MsilILAsmVersion).
          "$ildasm" -out="$RUNNER_TEMP/smoke.out.il" "$RUNNER_TEMP/smoke.dll"
          if ! grep -q '^\.assembly smoke' "$RUNNER_TEMP/smoke.out.il"; then
            echo "::error::$ildasm did not disassemble smoke.dll"
            exit 1
          fi
          echo "MSIL_ILASM=$ilasm" >> "$GITHUB_ENV"
          echo "MSIL_ILDASM=$ildasm" >> "$GITHUB_ENV"

          dotnet tool update --global dotnet-ilverify --version "$ilverify_version"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Export the .NET Framework 4.8 reference assemblies (NuGet)
        run: |
          # The refs-net48 leg of lit-legs.sh links against them (msil_references=net48, plan
          # 5.12.12); the restore above fetched microsoft.netframework.referenceassemblies.net48
          # at MsilNet48RefAssembliesVersion, and lit.cfg.py reads MSIL_REF_NET48.
          version=$(dotnet msbuild "$MSIL_TOOLS_PROJ" -getProperty:MsilNet48RefAssembliesVersion | tr -d '\r')
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cannot read MsilNet48RefAssembliesVersion from $MSIL_TOOLS_PROJ (got '$version')"
            exit 1
          fi
          packages=${NUGET_PACKAGES:-$HOME/.nuget/packages}
          net48=$packages/microsoft.netframework.referenceassemblies.net48/$version/build/.NETFramework/v4.8
          if [[ ! -f $net48/mscorlib.dll ]]; then
            echo "::error::$net48/mscorlib.dll not found after 'dotnet restore $MSIL_TOOLS_PROJ'"
            exit 1
          fi
          echo "MSIL_REF_NET48=$net48" >> "$GITHUB_ENV"

      - name: Exit-corpus cache directory (outside the checkout)
        run: echo "MSIL_CORPUS_CACHE=$RUNNER_TEMP/msil-corpus" >> "$GITHUB_ENV"

      - name: Cache the exit corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA upstream pins for actions/cache/restore and actions/cache/save)
        with:
          path: ${{ env.MSIL_CORPUS_CACHE }}
          key: msil-corpus-${{ runner.os }}-${{ hashFiles('msil/utils/corpus/manifest.json') }}-${{ env.MSIL_CORPUS_SKIP }}

      - name: Fetch and verify the exit corpus (msil/utils/corpus/fetch.py)
        run: |
          # Only the entries the cache lacks are downloaded, every hash is
          # verified, and --check writes the stamp the corpus legs read; the
          # entries of MSIL_CORPUS_SKIP are left out (an empty value skips none).
          python3 msil/utils/corpus/fetch.py --cache "$MSIL_CORPUS_CACHE" --skip "$MSIL_CORPUS_SKIP"
          python3 msil/utils/corpus/fetch.py --cache "$MSIL_CORPUS_CACHE" --check --skip "$MSIL_CORPUS_SKIP"

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: msil-linux
          max-size: 2G
          variant: sccache

      - name: Configure (msil/utils/ci/configure.sh)
        run: bash msil/utils/ci/configure.sh build

      - name: Build (msil/utils/ci/build.sh)
        id: build
        run: bash msil/utils/ci/build.sh build

      - name: Unit tests (msil/utils/ci/unit-tests.sh)
        run: bash msil/utils/ci/unit-tests.sh build

      - name: Test legs (msil/utils/ci/lit-legs.sh)
        run: |
          full=()
          if [[ $FULL_CHECK == true ]]; then full=(--full); fi
          bash msil/utils/ci/lit-legs.sh "${full[@]}" build

      # The CIL objects and archives of msil/test/M1 for both x86_64 MSIL
      # triples at -O0 and -O2; the determinism job compares them with the
      # Windows job's (plan 5.12.12). The tools are given as absolute paths:
      # det-manifest.py runs llvm-ar from its work directory.
      - name: Determinism manifest (msil/utils/ci/det-manifest.py)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 msil/utils/ci/det-manifest.py build --clang "$GITHUB_WORKSPACE/build/bin/clang" --ar "$GITHUB_WORKSPACE/build/bin/llvm-ar" --out build/lit-results/det-linux.txt --work "$RUNNER_TEMP/det"

      - name: Upload the determinism manifest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msil-det-linux
          path: build/lit-results/det-linux.txt
          retention-days: 7

      - name: Upload test outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msil-linux-test-output
          path: |
            build/lit-results/
            build/tools/msil/test/**/Output/
            build/test/CodeGen/MSIL/Output/
            build/tools/clang/test/CodeGen/MSIL/Output/
          retention-days: 7

  windows:
    name: Windows x64 (.NET 8, 10 and .NET Framework 4.8)
    if: github.repository_owner == 'alethic'
    runs-on: windows-2022
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up the MSVC environment (clang-cl, and LIB/INCLUDE for the native oracle)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages and dotnet tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA upstream pins for actions/cache/restore and actions/cache/save)
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/tools
          key: msil-dotnet-tools-${{ runner.os }}-${{ hashFiles('msil/utils/tools/msil-tools.proj') }}

      - name: Install ninja, ILVerify and the .NET ilasm and ildasm
        run: |
          choco install ninja --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install ninja failed ($LASTEXITCODE)" }
          $version = (dotnet msbuild $env:MSIL_TOOLS_PROJ -getProperty:MsilILVerifyVersion | Out-String).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "cannot read MsilILVerifyVersion from $env:MSIL_TOOLS_PROJ (got '$version')" }
          dotnet tool update --global dotnet-ilverify --version $version
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool update dotnet-ilverify failed ($LASTEXITCODE)" }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # The modern-ilasm and roundtrip legs use runtime.win-x64.Microsoft.NETCore.ILAsm and
          # .ILDAsm at MsilILAsmVersion (lit-legs.ps1 and lit.cfg.py find them in the NuGet
          # global-packages folder).
          dotnet restore $env:MSIL_TOOLS_PROJ -p:MsilToolsRid=win-x64
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore $env:MSIL_TOOLS_PROJ failed ($LASTEXITCODE)" }

      - name: Exit-corpus cache directory (outside the checkout)
        run: '"MSIL_CORPUS_CACHE=$env:RUNNER_TEMP\msil-corpus" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Cache the exit corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA upstream pins for actions/cache/restore and actions/cache/save)
        with:
          path: ${{ env.MSIL_CORPUS_CACHE }}
          key: msil-corpus-${{ runner.os }}-${{ hashFiles('msil/utils/corpus/manifest.json') }}-${{ env.MSIL_CORPUS_SKIP }}

      - name: Fetch and verify the exit corpus (msil/utils/corpus/fetch.py)
        run: |
          # As in the Linux job: only missing entries are downloaded, --check
          # writes the stamp, and the entries of MSIL_CORPUS_SKIP are left out.
          python msil/utils/corpus/fetch.py --cache $env:MSIL_CORPUS_CACHE --skip "$env:MSIL_CORPUS_SKIP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python msil/utils/corpus/fetch.py --cache $env:MSIL_CORPUS_CACHE --check --skip "$env:MSIL_CORPUS_SKIP"
          exit $LASTEXITCODE

      - name: Check the .NET Framework tools (ilasm, PEVerify, ildasm)
        run: |
          # Fail here, not after the build, if the image lacks them (flags as in %ilasm).
          $il = "$env:RUNNER_TEMP/smoke.il"
          $dll = "$env:RUNNER_TEMP/smoke.dll"
          Set-Content -Path $il -Value '.assembly extern mscorlib {}', '.assembly smoke {}'
          $ilasm = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/ilasm.exe'
          if (-not (Test-Path -LiteralPath $ilasm)) { throw "Framework ilasm not found: $ilasm" }
          & $ilasm -nologo -quiet -dll -pe64 -x64 "-output=$dll" $il
          if ($LASTEXITCODE -ne 0) { throw "Framework ilasm failed ($LASTEXITCODE)" }
          $peverify = @(Resolve-Path "${env:ProgramFiles(x86)}/Microsoft SDKs/Windows/v*/bin/NETFX 4.* Tools/x64/PEVerify.exe" -ErrorAction SilentlyContinue)
          if ($peverify.Count -eq 0) { throw 'PEVerify.exe (NETFX 4.x Tools of the Windows SDK) not found; msil_require_verify=1 needs it' }
          & $peverify[0].Path /nologo $dll
          if ($LASTEXITCODE -ne 0) { throw "PEVerify failed ($LASTEXITCODE)" }
          # msil-verify.py round-trips every DLL through ildasm and ilasm; lit.cfg.py
          # finds this ildasm in the NETFX tools directory. /out keeps its GUI closed.
          $ildasm = Join-Path (Split-Path -Parent $peverify[0].Path) 'ildasm.exe'
          if (-not (Test-Path -LiteralPath $ildasm)) { throw "ildasm.exe not found next to $($peverify[0].Path)" }
          & $ildasm /nobar "/out=$env:RUNNER_TEMP/smoke.out.il" $dll
          if ($LASTEXITCODE -ne 0) { throw "ildasm failed ($LASTEXITCODE)" }
          if (-not (Select-String -LiteralPath "$env:RUNNER_TEMP/smoke.out.il" -Pattern '^\.assembly smoke' -Quiet)) { throw "$ildasm did not disassemble smoke.dll" }

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: msil-windows
          max-size: 3G
          variant: sccache

      - name: Configure (msil/utils/ci/configure.ps1 -Ci)
        run: pwsh -NoProfile -File msil/utils/ci/configure.ps1 -Ci

      - name: Build (msil/utils/ci/build.ps1)
        id: build
        run: pwsh -NoProfile -File msil/utils/ci/build.ps1

      - name: Unit tests (msil/utils/ci/unit-tests.ps1)
        run: pwsh -NoProfile -File msil/utils/ci/unit-tests.ps1

      - name: Test legs (msil/utils/ci/lit-legs.ps1)
        run: |
          $legArgs = @()
          if ($env:FULL_CHECK -eq 'true') { $legArgs += '-Full' }
          pwsh -NoProfile -File msil/utils/ci/lit-legs.ps1 @legArgs
          exit $LASTEXITCODE

      # As in the Linux job (absolute tool paths); the determinism job
      # compares the two manifests.
      - name: Determinism manifest (msil/utils/ci/det-manifest.py)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python msil/utils/ci/det-manifest.py build --clang "$env:GITHUB_WORKSPACE\build\bin\clang.exe" --ar "$env:GITHUB_WORKSPACE\build\bin\llvm-ar.exe" --out build/lit-results/det-windows.txt --work "$env:RUNNER_TEMP/det"
          exit $LASTEXITCODE

      - name: Upload the determinism manifest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msil-det-windows
          path: build/lit-results/det-windows.txt
          retention-days: 7

      # The upstream regression tests of the upstream files the fork changes
      # (msil/utils/upstream-hooks.txt): the action-pin check, the curated lit
      # list and the full TargetParserTests and MCTests. It runs whenever the
      # build passed, also after failed unit tests or test legs (as in
      # run-m1-gate.ps1). Two legs are left to the development host's gate:
      # the manifest leg diffs against the upstream merge commit, which this
      # shallow checkout lacks (-NoManifest), and the compile leg's private
      # build tree (clang and lldb for the ARM target) is a development-host
      # cost (-NoCompile). This build has no WebAssembly target, so the
      # list's WebAssembly tests are UNSUPPORTED here: hence -MinPass 250
      # instead of the manifest's min-pass, which the gate enforces, and the
      # script leaves Disassembler.WebAssemblyTest out of MCTests. Its lit
      # report and log (build/lit-results/upstream-hooks.*) are uploaded below.
      # check-action-pins.py checks this step's run: line, its if: guard and
      # that the guard names the Build step's id: (steps.<missing id> is null,
      # which would skip this step while the job stays green).
      - name: Upstream hook tests (msil/utils/ci/upstream-hooks.ps1)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pwsh -NoProfile -File msil/utils/ci/upstream-hooks.ps1 -NoCompile -NoManifest -MinPass 250

      - name: Upload test outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msil-windows-test-output
          path: |
            build/lit-results/
            build/tools/msil/test/**/Output/
            build/test/CodeGen/MSIL/Output/
            build/tools/clang/test/CodeGen/MSIL/Output/
          retention-days: 7

  # Cross-host determinism (plan 5.12.12; section 12 'Cross-host determinism'):
  # the CIL objects and archives that both jobs built from msil/test/M1 must
  # be byte for byte the same (det-manifest.py compare fails on a differing
  # entry or when the manifests have no entry in common). No PE is compared:
  # the Windows runner has no Linux sysroot and the Linux runner no Windows
  # import libraries; each job's det leg checks its own PEs.
  determinism:
    name: Cross-host determinism (objects and archives)
    needs: [linux, windows]
    if: ${{ !cancelled() && github.repository_owner == 'alethic' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download the Linux manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msil-det-linux
          path: det

      - name: Download the Windows manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msil-det-windows
          path: det

      - name: Compare (msil/utils/ci/det-manifest.py compare)
        run: python3 msil/utils/ci/det-manifest.py compare det/det-linux.txt det/det-windows.txt
