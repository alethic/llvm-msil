if "MSIL" not in config.root.targets:
    config.unsupported = True

# Like NVPTX's %ptxas-verify (llvm/test/lit.cfg.py): when an ilasm is
# available, a test that produces a complete module also checks that the llc
# output assembles:
#   ; RUN: %if ilasm %{ llc < %s -mtriple=x86_64-unknown-linux-gnu-msil -o %t.il && %ilasm-verify -output=%t.dll %t.il %}
# ilasm is chosen exactly as msil/test/lit.cfg.py chooses it, so one setting
# selects the same ilasm for both suites (the gate runs them in one lit
# invocation):
#   1. --param msil_ilasm=nuget: the newest NuGet package
#      runtime.<rid>.Microsoft.NETCore.ILAsm (an error if there is none);
#   2. --param msil_ilasm=PATH-OR-NAME, else $MSIL_ILASM=PATH-OR-NAME (a path
#      or a program on PATH; "nuget" is only a --param value): an empty value
#      disables ilasm, a value that names no program is an error;
#   3. the CMake value MSIL_ILASM_EXECUTABLE that msil/test's lit.site.cfg
#      also gets, read here from <llvm_obj_root>/CMakeCache.txt;
#   4. the .NET Framework ilasm on Windows (plan decision D31), then ilasm on
#      PATH, then the NuGet package of step 1 (not after an empty override).
# The NuGet search looks in $NUGET_PACKAGES, the global-packages folder that
# dotnet reports and ~/.nuget/packages. The only difference from msil/test is
# that dotnet is looked up (with msil/test's precedence for dotnet) only when
# that search runs. $LLVM_ILASM_EXECUTABLE (the recon/tests-ci.md 3.1
# prototype) is not read. With --param msil_require_verify=1 (every gate,
# decision D38) a missing ilasm is a configuration error instead of a
# silently skipped round trip.
import glob
import os
import platform
import re
import subprocess

import lit.util

_params = lit_config.params
_is_windows = platform.system() == "Windows"
_exe_ext = ".exe" if _is_windows else ""


def _fatal(msg):
    lit_config.fatal("llvm/test/CodeGen/MSIL: " + msg)


def _version_key(path):
    m = re.search(r"(\d+)\.(\d+)\.(\d+)", path)
    return tuple(int(x) for x in m.groups()) if m else (0, 0, 0)


def _runnable(path):
    # X_OK matters on Linux: NuGet may extract ilasm without the x bit.
    return bool(path) and os.path.isfile(path) and os.access(path, os.X_OK)


def _cmake_value(name):
    """MSIL_<NAME>_EXECUTABLE from the build tree's CMakeCache.txt, the value
    msil/test's lit.site.cfg is configured with ('' if unset or NOTFOUND)."""
    obj_root = getattr(config, "llvm_obj_root", None)
    if not obj_root:
        return ""
    var = "MSIL_%s_EXECUTABLE" % name.upper()
    try:
        with open(os.path.join(obj_root, "CMakeCache.txt"), encoding="utf-8") as f:
            for line in f:
                m = re.match(r"%s(?::[A-Za-z_]+)?=(.*)$" % var, line.rstrip("\r\n"))
                if m:
                    value = m.group(1).strip()
                    return "" if value.endswith("-NOTFOUND") else value
    except OSError:
        pass
    return ""


def _overridden(name):
    """True if --param msil_<name> or $MSIL_<NAME> is set (even to empty)."""
    return _params.get("msil_" + name) is not None or "MSIL_" + name.upper() in os.environ


def _find_tool(name, preferred=(), fallback=()):
    """msil/test/lit.cfg.py find_tool: --param msil_<name>, $MSIL_<NAME>, the
    CMake value, preferred, PATH, fallback."""
    override = _params.get("msil_" + name)
    if override is None:
        override = os.environ.get("MSIL_" + name.upper())
    if override is not None:
        if override == "":
            lit_config.note("%s disabled by an empty override" % name)
            return None
        found = override if _runnable(override) else lit.util.which(override)
        if not found:
            _fatal("msil_%s=%s: no such program" % (name, override))
        return os.path.normpath(found)
    for candidate in [_cmake_value(name), *preferred, lit.util.which(name), *fallback]:
        if _runnable(candidate):
            return os.path.normpath(candidate)
    return None


def _find_dotnet():
    # The fallbacks of msil/test/lit.cfg.py.
    home = os.path.expanduser("~")
    if _is_windows:
        known = [r"C:\Program Files\dotnet\dotnet.exe"]
    else:
        known = [
            "/usr/share/dotnet/dotnet",
            "/usr/lib/dotnet/dotnet",
            "/usr/local/share/dotnet/dotnet",
        ]
    return _find_tool(
        "dotnet",
        fallback=[
            os.path.join(os.environ.get("DOTNET_ROOT", ""), "dotnet" + _exe_ext),
            *known,
            os.path.join(home, ".dotnet", "dotnet" + _exe_ext),
        ],
    )


def _nuget_ilasm():
    """The newest runtime.<rid>.Microsoft.NETCore.ILAsm from the NuGet
    global-packages folders, or None."""
    rid = {"Windows": "win", "Linux": "linux", "Darwin": "osx"}.get(
        platform.system(), ""
    )
    rid += "-arm64" if platform.machine().lower() in ("arm64", "aarch64") else "-x64"
    roots = [
        os.environ.get("NUGET_PACKAGES"),
        os.path.join(os.path.expanduser("~"), ".nuget", "packages"),
    ]
    dotnet = _find_dotnet()
    if dotnet:
        # dotnet itself resolves the configured folder; this config never
        # reads NuGet.Config.
        try:
            out = subprocess.run(
                [dotnet, "nuget", "locals", "global-packages", "--list"],
                stdin=subprocess.DEVNULL,
                stdout=subprocess.PIPE,
                stderr=subprocess.DEVNULL,
                timeout=120,
            )
            m = (
                re.search(
                    r"^global-packages:\s*(.+?)\s*$",
                    out.stdout.decode("utf-8", "replace"),
                    re.M,
                )
                if out.returncode == 0
                else None
            )
            if m:
                roots.insert(1, m.group(1))
        except (OSError, subprocess.SubprocessError):
            pass
    hits = []
    for root in filter(None, roots):
        hits += glob.glob(
            os.path.join(
                root,
                "runtime.%s.microsoft.netcore.ilasm" % rid,
                "*",
                "runtimes",
                rid,
                "native",
                "ilasm" + _exe_ext,
            )
        )
    hits = [h for h in set(hits) if _runnable(h)]
    return os.path.normpath(max(hits, key=_version_key)) if hits else None


def _find_ilasm():
    if _params.get("msil_ilasm", "").lower() == "nuget":
        found = _nuget_ilasm()
        if not found:
            _fatal("msil_ilasm=nuget: no runtime.<rid>.microsoft.netcore.ilasm package found")
        return found
    framework = []
    if _is_windows:
        windir = os.environ.get("WINDIR") or os.environ.get("SystemRoot") or r"C:\Windows"
        framework = [
            os.path.join(windir, "Microsoft.NET", "Framework64", "v4.0.30319", "ilasm.exe")
        ]
    found = _find_tool("ilasm", preferred=framework)
    if not found and not _overridden("ilasm"):
        found = _nuget_ilasm()
    return found


if not config.unsupported:
    _ilasm = _find_ilasm()
    if _ilasm:
        config.available_features.add("ilasm")
        config.substitutions.append(
            ("%ilasm-verify", '"%s" -nologo -quiet -dll -pe64 -x64' % _ilasm)
        )
    elif lit.util.pythonize_bool(_params.get("msil_require_verify", "0")):
        _fatal(
            "msil_require_verify=1 but no ilasm was found (pass --param "
            "msil_ilasm=PATH or set $MSIL_ILASM)"
        )

    # llvm-cil-dump (M17) is a fork tool that neither LLVM_TEST_DEPENDS nor
    # CLANG_TEST_DEPS lists (check-msil and the gates' build-targets.txt build
    # it), so 'ninja check-llvm-codegen-msil' or check-clang can run on a tree
    # where it was never built. The 'llvm-cil-dump' feature lets the tests that
    # read a CIL object back (object-*.ll, clang/test/CodeGen/MSIL/emit-obj.c)
    # REQUIRE it and report UNSUPPORTED there instead of failing with 'command
    # not found', as llvm/test/tools/llvm-cil-dump does. Under
    # msil_require_verify=1 (every gate, decision D38) a missing llvm-cil-dump
    # is a configuration error rather than a silently skipped test. The check
    # is llvm/test/MC/MSIL/lit.local.cfg's; that directory and
    # clang/test/CodeGen/MSIL load this file, so they get the feature too
    # (both site configurations define config.llvm_tools_dir).
    _dump = os.path.join(config.llvm_tools_dir, "llvm-cil-dump")
    if os.path.isfile(_dump) or os.path.isfile(_dump + ".exe"):
        config.available_features.add("llvm-cil-dump")
    elif lit.util.pythonize_bool(_params.get("msil_require_verify", "0")):
        _fatal(
            "msil_require_verify=1 but llvm-cil-dump was not found in %s "
            "(build the llvm-cil-dump target)" % config.llvm_tools_dir
        )
