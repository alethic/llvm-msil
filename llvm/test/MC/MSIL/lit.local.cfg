# llvm/test/MC/MSIL: the MSIL MC layer (ImplementationPlan.md M18): one MCInst
# per CIL instruction, its binary encoding as llc -show-mc-encoding shows it,
# the operand spellings of the InstPrinter (whole-program and object form),
# and the MC tools that have no MSIL support.
import os

import lit.util

if "MSIL" not in config.root.targets:
    config.unsupported = True
else:
    # The 'ilasm' feature and %ilasm-verify, with exactly the ilasm that
    # llvm/test/CodeGen/MSIL chooses (the same --param msil_ilasm,
    # $MSIL_ILASM, CMake and fallback order, and a missing ilasm is a
    # configuration error under --param msil_require_verify=1), so that one
    # setting selects one ilasm for both directories.
    lit_config.load_config(
        config,
        os.path.join(config.test_source_root, "CodeGen", "MSIL", "lit.local.cfg"),
    )

if not config.unsupported:
    # llvm-cil-dump (M17) is a fork tool that LLVM_TEST_DEPENDS does not list
    # (check-msil builds it). The 'llvm-cil-dump' feature guards the steps that
    # read an assembled image back; under msil_require_verify=1 (every gate,
    # decision D38) a missing llvm-cil-dump is a configuration error rather
    # than a silently skipped check, as in msil/test (plan section 12,
    # 2026-10-24, 'msil_cil_dump under msil_require_verify=1').
    _dump = os.path.join(config.llvm_tools_dir, "llvm-cil-dump")
    if os.path.isfile(_dump) or os.path.isfile(_dump + ".exe"):
        config.available_features.add("llvm-cil-dump")
    elif lit.util.pythonize_bool(lit_config.params.get("msil_require_verify", "0")):
        lit_config.fatal(
            "llvm/test/MC/MSIL: msil_require_verify=1 but llvm-cil-dump was "
            "not found in %s (build the llvm-cil-dump target)"
            % config.llvm_tools_dir
        )
