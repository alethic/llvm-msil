import os

# llvm-cil-copy and llvm-cil-dump are tools of the MSIL fork that
# LLVM_TEST_DEPENDS does not list, so check-llvm and
# check-llvm-tools-llvm-cil-copy do not build them (check-msil does). The
# tests here dump every copy, so they need both; without them every test
# would fail with 'command not found'. Report them as unsupported instead.
def _has_tool(name):
    path = os.path.join(config.llvm_tools_dir, name)
    return os.path.isfile(path) or os.path.isfile(path + ".exe")


if not (_has_tool("llvm-cil-copy") and _has_tool("llvm-cil-dump")):
    config.unsupported = True
