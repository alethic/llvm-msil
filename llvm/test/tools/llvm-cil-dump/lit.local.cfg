import os

# llvm-cil-dump is a tool of the MSIL fork that LLVM_TEST_DEPENDS does not
# list, so check-llvm and check-llvm-tools-llvm-cil-dump do not build it
# (check-msil does). Without it every test here would fail with 'command not
# found'; report them as unsupported instead.
def _has_tool(name):
    path = os.path.join(config.llvm_tools_dir, name)
    return os.path.isfile(path) or os.path.isfile(path + ".exe")


if not _has_tool("llvm-cil-dump"):
    config.unsupported = True
