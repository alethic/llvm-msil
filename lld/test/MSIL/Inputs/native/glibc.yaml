## Relocatable objects from which tests build a small glibc 2.43-like set of
## shared objects with 'ld.lld -shared -soname <name> --version-script
## glibc-<lib>.map' (ImplementationPlan.md 5.10.8; recon p2 native-imports
## 2.2: the names, kinds and versions are glibc's, the code is not). A symbol
## named '<name>@<version>' is a hidden (non-default) version of <name>, as an
## assembler writes it for '.symver'. -D MACHINE=... builds them for another
## machine. Documents (yaml2obj --docnum):
##   1  libc.so.6
##   2  libm.so.6
##   3  ld-linux-x86-64.so.2
##   4  libmvec.so.1
##   5  libc_nonshared.a's member atexit.oS (native code only)
