# lld/test/MSIL: msil-ld, the msil flavor of lld (ImplementationPlan.md 5.9,
# M13 on). The tests run when the MSIL target is built: lld/test/lit.cfg.py
# maps the MSIL entry of 'llvm-config --targets-built' to the feature 'msil',
# as it maps WebAssembly to 'wasm' for lld/test/wasm. lld always links the
# msil flavor (lldMSIL), so the feature is all the tests need.
import os
import sys

if "msil" not in config.available_features:
    config.unsupported = True

config.suffixes = [".test", ".yaml", ".ll", ".s"]

# %lld_exe: the multi-flavor lld executable of this build (lld -flavor msil,
# the generic-driver message, and the renamed copies of dispatch.test). Plain
# 'lld' has no tool substitution in lld/test/lit.cfg.py, and a PATH lookup
# could find another lld (Visual Studio ships one).
config.substitutions.append(
    (
        "%lld_exe",
        os.path.join(
            config.lld_tools_dir, "lld" + (".exe" if sys.platform == "win32" else "")
        ),
    )
)
