# lld/test/MSIL: msil-ld, the msil flavor of lld (ImplementationPlan.md 5.9,
# M13 on). The tests run when the MSIL target is built: lld/test/lit.cfg.py
# maps the MSIL entry of 'llvm-config --targets-built' to the feature 'msil',
# as it maps WebAssembly to 'wasm' for lld/test/wasm. lld always links the
# msil flavor (lldMSIL), so the feature is all the tests need.
import os
import sys

if "msil" not in config.available_features:
    config.unsupported = True

config.suffixes = [".test", ".yaml", ".ll", ".s"]

# %lld_exe: the multi-flavor lld executable of this build (lld -flavor msil,
# the generic-driver message, and the renamed copies of dispatch.test). Plain
# 'lld' has no tool substitution in lld/test/lit.cfg.py, and a PATH lookup
# could find another lld (Visual Studio ships one).
config.substitutions.append(
    (
        "%lld_exe",
        os.path.join(
            config.lld_tools_dir, "lld" + (".exe" if sys.platform == "win32" else "")
        ),
    )
)

# From M20 msil-ld links CIL objects and writes the PE, and the obj-*.test
# files read the images back with llvm-cil-dump (M17; 5.7.10) and assemble
# hand-written object-form text (5.8.4) with ilasm. Both come from
# llvm/test/CodeGen/MSIL/lit.local.cfg, loaded here with
# lit_config.load_config as clang/test/CodeGen/MSIL/lit.local.cfg loads it, so
# one setting selects the same ilasm for every MSIL suite:
#   - the optional 'ilasm' feature and %ilasm-verify (--param msil_ilasm,
#     $MSIL_ILASM, the CMake value, then the platform defaults; with --param
#     msil_require_verify=1 a missing ilasm is a configuration error);
#   - the 'llvm-cil-dump' feature: llvm-cil-dump is a fork tool that
#     LLD_TEST_DEPS does not list (check-msil and the gates' build targets
#     build it), so a test that dumps an image says 'REQUIRES: llvm-cil-dump'
#     and is UNSUPPORTED on a tree without it, and a configuration error under
#     msil_require_verify=1 (decision D38).
# That file starts with 'if "MSIL" not in config.root.targets', a set only
# llvm/test/lit.cfg.py defines; the 'msil' feature already says that MSIL is
# built, so the set exists only while that file runs.
if not config.unsupported:
    _llvm_msil_cfg = os.path.join(
        config.llvm_src_root, "test", "CodeGen", "MSIL", "lit.local.cfg"
    )
    _set_targets = not hasattr(config.root, "targets")
    if _set_targets:
        config.root.targets = frozenset(["MSIL"])
    try:
        lit_config.load_config(config, _llvm_msil_cfg)
    finally:
        if _set_targets:
            del config.root.targets
