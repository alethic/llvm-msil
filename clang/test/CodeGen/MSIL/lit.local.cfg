# The clang tests here that run the MSIL backend may assemble their output.
# When the backend is built ('msil-registered-target'), this directory gets the
# optional 'ilasm' feature and the %ilasm-verify substitution by loading
# llvm/test/CodeGen/MSIL/lit.local.cfg into this directory's configuration with
# lit_config.load_config, which runs that file in its own namespace exactly as
# lit runs it for its own directory. Both directories therefore choose the same
# ilasm from the same settings: --param msil_ilasm (a path, a program name,
# 'nuget', or empty to disable ilasm), $MSIL_ILASM, the CMake value
# MSIL_ILASM_EXECUTABLE, then the platform defaults; with --param
# msil_require_verify=1 a missing ilasm is a configuration error (reported
# under that file's name). A test assembles its output like this:
#   // RUN: %if ilasm %{ %ilasm-verify -output=%t.dll %t.il %}
# The frontend-only tests here need no backend, so this file never marks the
# directory unsupported.
import os

if "msil-registered-target" in config.available_features:
    # That file starts with 'if "MSIL" not in config.root.targets', a set only
    # llvm/test/lit.cfg.py defines. config.root is this directory's own copy of
    # the configuration (lit copies it for every lit.local.cfg, and
    # subdirectories inherit it), and the feature already says MSIL is built.
    # The set exists only while that file runs: {"MSIL"} would wrongly say that
    # MSIL is the only target built.
    _llvm_msil_cfg = os.path.join(
        config.llvm_src_root, "test", "CodeGen", "MSIL", "lit.local.cfg"
    )
    _unsupported = config.unsupported
    _set_targets = not hasattr(config.root, "targets")
    if _set_targets:
        config.root.targets = frozenset(["MSIL"])
    try:
        lit_config.load_config(config, _llvm_msil_cfg)
    finally:
        if _set_targets:
            del config.root.targets
        config.unsupported = _unsupported
